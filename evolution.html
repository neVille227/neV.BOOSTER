<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0507">
<title>neV.BOOSTER — Mon évolution</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/nev.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/calm.css">
<link rel="stylesheet" href="css/light.css">
<link rel="stylesheet" href="css/evolution.css">
</head>
<body>
<div class="page"><div class="wrap">
  <div class="eyebrow" id="since">Depuis ton départ</div>
  <h1 class="big">Mon <em>évolution</em></h1>
  <p class="lead" id="lead">Chaque jour compte. Regarde d'où tu viens.</p>

  <section class="panel ev-ring" aria-label="Ton défi de 90 jours">
    <div class="ring" id="ring" role="img" aria-label="Progression sur 90 jours"></div>
    <div class="ev-ring-t"><b id="ringDay">Jour 1</b><span id="ringTxt">sur 90</span><div class="ev-stage" id="stage"></div></div>
  </section>

  <div class="kpi ev-kpi" id="kpi"></div>

  <h2 class="sec-t">Avant / aujourd'hui</h2>
  <section class="panel" id="photos"></section>

  <h2 class="sec-t">Ton activité</h2><p class="sec-s">Séances validées par semaine, sur les 12 dernières semaines.</p>
  <section class="panel"><div id="weeks" class="weeks" role="img" aria-label="Séances par semaine"></div></section>

  <div id="wBlock" hidden>
    <h2 class="sec-t">Ton poids</h2><p class="sec-s">Seulement si tu l'as indiqué. Ces chiffres ne sont jamais publics.</p>
    <section class="panel"><div id="wChart" class="wchart" role="img" aria-label="Courbe de poids"></div></section>
  </div>

  <h2 class="sec-t">Ton parcours</h2>
  <section class="panel"><ol class="tl" id="tl"></ol></section>
</div></div>
<script src="js/core.js"></script>
<script src="js/cloud.js"></script>
<script src="js/rewards.js"></script>
<script src="js/ui.js"></script>
<script src="js/evolution.js"></script>
<script src="js/p-evolution.js"></script>
<script src="js/i18n.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
