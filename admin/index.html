<div id="gate" class="gate" hidden>

    <img class="admicon" src="../img/admin-192.png" alt="" width="84" height="84">
    <div class="eyebrow">Espace admin</div>
    <h1 style="margin:6px 0 4px">neV.<em style="color:var(--red);font-style:normal">BOOSTER</em></h1>
