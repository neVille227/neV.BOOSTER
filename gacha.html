<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0507">
<title>neV.BOOSTER — Gacha du jour</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/nev.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/light.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/gacha.css">
</head>
<body>
<div class="page"><div class="wrap">
  <div class="eyebrow">Gacha du jour</div>
  <h1 class="big" id="gTitle">Ton tirage du <em>jour</em></h1>
  <p class="lead" id="gLead">Cinq cartes, une seule pour toi. Le doigt choisit, le hasard décide de ton entraînement.</p>
  <div id="gAlert" style="margin-top:16px"></div>

  <section class="pickrow" id="pick" aria-label="Choisis ton tirage" hidden>
    <button type="button" class="pk" id="pkOne"><div class="pkh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="11" height="16" rx="2" transform="rotate(-8 10 11)"/><rect x="9" y="5" width="11" height="16" rx="2" transform="rotate(8 14 13)"/></svg><b>Tirer une carte</b></div><span>1 carte parmi 5, une séance claire.</span><span class="chip red">Tirage du jour</span></button>
    <a class="pk" href="gacha-box.html" data-go><div class="pkh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg><b>Gacha Box</b></div><span>La boîte 3D : 4 cartes, un combo.</span><span class="chip gold">4 cartes</span></a>
  </section>

  <section class="gstage" id="gstage" aria-label="Zone de tirage">
    <button type="button" class="snd" id="snd" aria-pressed="false">Son : oui</button>
    <div id="board">
      <div class="gtable" id="gtable"></div>
      <p class="gmsg" id="gmsg" role="status"></p>
      <div class="gactions" id="gactions"><button type="button" class="btn big" id="btnDraw">Tirer ma carte</button></div>
    </div>
    <div class="reveal" id="reveal" hidden></div>
  </section>

  <details class="odds panel" style="margin-top:22px">
    <summary>Tes chances de tirage (transparence totale)</summary>
    <p class="muted" id="oddsTxt" style="margin:10px 0 0"></p>
    <div class="prob" id="prob"></div>
    <p class="muted" id="spTxt" style="margin:12px 0 0;font-size:.88rem"></p>
  </details>
</div></div>
<script src="js/core.js"></script>
<script src="js/cloud.js"></script>
<script src="js/rewards.js"></script>
<script src="js/ui.js"></script>
<script src="js/ex-data.js"></script>
<script src="js/ex-anim.js"></script>
<script src="js/ex-more.js"></script>
<script src="js/ex-extra.js"></script>
<script src="js/exercises.js"></script>
<script src="js/zones.js"></script>
<script src="js/gachaengine.js"></script>
<script src="js/figure.js"></script>
<script src="js/card.js"></script>
<script src="js/mannequin3d.js"></script>
<script src="js/sfx.js"></script>
<script src="js/fx.js"></script>
<script src="js/p-gacha.js"></script>
<script src="js/i18n.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
