<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0507">
<title>neV.BOOSTER — Bibliothèque</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/nev.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/exercice.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/lib.css">
<link rel="stylesheet" href="css/bibliotheque.css">
</head>
<body>
<div class="page"><div class="wrap">
  <div class="eyebrow">Bibliothèque</div>
  <h1 class="big">Tous les exercices, <em>en cartes</em></h1>
  <p class="lead" id="lead"></p>
  <div class="fbar" id="fbar">
    <input type="search" id="q" placeholder="Rechercher un exercice ou un muscle" aria-label="Rechercher">
    <button type="button" class="btn ghost" id="shuf">🔀 Mélanger</button>
  </div>
  <div class="fchips" id="cats" role="group" aria-label="Catégories"></div>
  <div class="fchips" id="tiers" role="group" aria-label="Difficulté"></div>
  <label class="check" style="margin:8px 0"><input type="checkbox" id="nomat"><span>Sans matériel seulement</span></label>
  <p class="muted" id="count" aria-live="polite"></p>
  <div class="xg lib" id="grid"></div>
  <div class="cta" style="justify-content:center"><button type="button" class="btn ghost" id="more" hidden>Voir plus</button></div>
</div></div>
<script src="js/core.js"></script>
<script src="js/cloud.js"></script>
<script src="js/rewards.js"></script>
<script src="js/ui.js"></script>
<script src="js/ex-data.js"></script>

<script src="js/zones.js"></script>
<script src="js/combos.js"></script>
<script src="js/gachaengine.js"></script>
<script src="js/figure.js"></script>
<script src="js/card.js"></script>
<script src="js/exmodal.js"></script>
<script src="js/p-bibliotheque.js"></script>
<script src="js/i18n.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
