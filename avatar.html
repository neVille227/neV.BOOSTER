<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0507">
<title>neV.BOOSTER — Mon avatar</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/nev.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/light.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/avatar.css">
</head>
<body>
<div class="page"><div class="wrap">
  <div class="hero-page">
    <div class="eyebrow">Mon avatar</div>
    <h1 class="big">Crée <em>ton</em> personnage</h1>
    <p class="lead">Peau, cheveux, yeux, tenue, couleur d'accent : ton avatar te ressemble et apparaît partout sur le site, y compris dans les mannequins 3D des exercices.</p>
  </div>
  <div class="avx">
    <section class="panel avx-view" aria-label="Aperçu en direct">
      <div class="avx-stage" id="avStage"></div>
      <label class="avx-m" for="avM">Évolution (aperçu) <input type="range" id="avM" min="1" max="6" step="0.1" value="3"></label>
      <div class="avx-3d" id="av3d" hidden></div>
    </section>
    <section class="panel avx-ctl" id="avCtl" aria-label="Réglages de l'avatar"></section>
  </div>
</div></div>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/pwa.js"></script>
<script src="js/cloud.js"></script>
<script src="js/rewards.js"></script>
<script src="js/ui.js"></script>
<script src="js/hero.js"></script>
<script src="js/avatar-illus.js"></script>
<script src="js/hero-img.js"></script>
<script src="js/p-avatar.js"></script>
</body>
</html>
