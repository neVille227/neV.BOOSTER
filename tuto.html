<style>/* nev.css */
/* ==========================================================
   neV.BOOSTER — feuille de style commune
   Palette : rouge vin → rouge effort → braise → or
   ========================================================== */
:root{
  --bg:#0a0507; --bg2:#14080c;
  --wine:#7a0f26; --wine2:#4a0a1a; --red:#e0455f; --ember:#ff8a3d; --gold:#f0b24a;
  --cream:#fff1f2; --rose:#f3a6b0; --muted:#c2a3aa; --line:#4a2029;
  --ok:#3ddc84; --ok2:#16a34a; --danger:#ff7a8a;
  --panel:rgba(30,11,17,.78); --panel2:#2a1118;
  --grad-effort:linear-gradient(135deg,#4a0a1a 0%,#8e1b3c 42%,#e0455f 78%,#ff8a3d 100%);
  --grad-btn:linear-gradient(135deg,#8e1b3c,#e0455f 70%,#ff6a4d);
  --r:18px; --maxw:1120px;
  --f:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--cream);font-family:var(--f);line-height:1.5;
  background:radial-gradient(1100px 700px at 88% -12%,#5e1026 0,transparent 62%),radial-gradient(900px 600px at -5% 112%,#3a0a18 0,transparent 58%),var(--bg);
  background-attachment:fixed;
  animation:nevIn .85s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes nevIn{from{opacity:0;filter:blur(16px) brightness(1.7) saturate(1.4)}to{opacity:1;filter:none}}
.nev-leaving body{animation:none;transition:opacity .6s ease,filter .6s ease;opacity:0;filter:blur(16px) brightness(1.7) saturate(1.4);pointer-events:none}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.1;margin:0}
.wrap{width:min(var(--maxw),92%);margin:0 auto}
.page{padding:48px 0 110px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- en-tête et navigation ---------- */
.hdr{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:linear-gradient(180deg,#0a0507e6,#0a050799);border-bottom:1px solid #ffffff12}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 0}
.logo{font-weight:900;letter-spacing:.06em;font-size:1.15rem;text-decoration:none;white-space:nowrap}
.logo span{color:var(--red)}
.me{display:flex;align-items:center;gap:10px;font-size:.82rem;font-weight:700}
.me .flame{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;background:#ff8a3d1f;border:1px solid #ff8a3d55;color:#ffc89a}
.me .who{color:var(--rose);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{background:none;border:1px solid #ffffff22;color:var(--muted);border-radius:99px;padding:6px 11px;font-size:.76rem}
.me button:hover{color:#fff;border-color:#fff6}

/* ---------- composants ---------- */
.eyebrow{color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.18em;font-size:.72rem}
h1.big{font-size:clamp(2rem,5.4vw,3.6rem);font-weight:900;letter-spacing:-.035em}
h1.big em,h2 em{font-style:normal;background:var(--grad-effort);-webkit-background-clip:text;background-clip:text;color:transparent;filter:saturate(1.3) brightness(1.25)}
h2.sec{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:64px 0 24px}
.lead{color:var(--muted);max-width:640px;font-size:1.02rem}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:30px;box-shadow:0 18px 50px #0006}
.panel.glow{box-shadow:0 0 0 1px #e0455f55,0 20px 60px #e0455f22}
.grid{display:grid;gap:26px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:800;font-size:.95rem;text-decoration:none;color:#fff;background:var(--grad-btn);box-shadow:0 10px 28px #e0455f40;transition:transform .18s,filter .18s,box-shadow .18s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:#ffffff0d;box-shadow:inset 0 0 0 1px #ffffff26;color:var(--cream)}
.btn.gold{background:linear-gradient(135deg,#f0b24a,#ff8a3d);color:#2a0d05;box-shadow:0 10px 28px #f0b24a40}
.btn.ok{background:linear-gradient(135deg,#16a34a,#3ddc84);color:#04260f;box-shadow:0 10px 28px #3ddc8440}
.btn.sm{padding:8px 14px;font-size:.8rem;border-radius:11px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:.74rem;font-weight:700;background:#ffffff0f;border:1px solid #ffffff1c;color:var(--rose)}
.chip.red{background:#e0455f22;border-color:#e0455f66;color:#ffb3bd}
.chip.gold{background:#f0b24a1c;border-color:#f0b24a55;color:var(--gold)}
.chip.ok{background:#3ddc8420;border-color:#3ddc8466;color:#9af0c0}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.field label{font-size:.8rem;font-weight:700;color:#ffdfe3}
.field input,.field select,.field textarea{background:#1c0b11;border:1px solid var(--line);border-radius:13px;padding:13px 14px;outline:none;transition:.2s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #e0455f2e}
.field .hint{font-size:.74rem;color:var(--muted)}
.field.bad input{border-color:var(--danger)}
.err{color:var(--danger);font-size:.84rem;font-weight:600;min-height:1.2em;margin:4px 0 10px}

<body>
<div class="page"><div class="wrap">
  <div class="hero-page">
    <div class="eyebrow">Tuto</div>
    <h1 class="big">Comment <em>ça marche</em> ?</h1>
    <p class="lead">En quelques minutes, tu sais tout : la carte du jour, l'exercice avec la caméra, les flammes, les badges et la progression de ton héros.</p>
  </div>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sommaire"></nav>
    <div class="art" id="art"></div>
  </div>
</div></div>
<script>/* core.js */
/* ==========================================================
   neV.BOOSTER — core.js
   Stockage, aléatoire, transitions, comptes, niveau, série.
   Tout passe par l'objet global NEV (pas de modules : le site
   fonctionne aussi s'il est ouvert depuis un simple dossier).
   ========================================================== */
(function (g) {
  'use strict';
  const NEV = (g.NEV = g.NEV || {});
  const doc = g.document;

  /* ---------- stockage (localStorage, avec repli mémoire) ---------- */
  const mem = {};
  let ls = null;
  try { ls = g.localStorage; ls.setItem('nev.t', '1'); ls.removeItem('nev.t'); } catch (e) { ls = null; }
  NEV.store = {
    get(k, d) {
      try { const v = ls ? ls.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; }
    },
    set(k, v) {
      try { const s = JSON.stringify(v); if (ls) ls.setItem(k, s); else mem[k] = s; } catch (e) { /* quota ou mode privé */ }
    },
    del(k) { try { if (ls) ls.removeItem(k); else delete mem[k]; } catch (e) { /* ignoré */ } },
    persistent: !!ls
  };

  /* ---------- aléatoire (crypto du navigateur) ---------- */
  const rng = (NEV.rng = {
    float() {
      const c = g.crypto || g.msCrypto;
      if (c && c.getRandomValues) {
        const a = new Uint32Array(2); c.getRandomValues(a);
        return ((a[0] >>> 5) * 67108864 + (a[1] >>> 6)) / 9007199254740992;
      }
      return Math.random();
    },
    int(n) { return Math.floor(rng.float() * n); },
    pick(arr) { return arr[rng.int(arr.length)]; },
    weighted(weights) {
      let total = 0; for (const w of weights) total += Math.max(0, w);
      let r = rng.float() * total;
      for (let i = 0; i < weights.length; i++) { r -= Math.max(0, weights[i]); if (r < 0) return i; }
      return weights.length - 1;
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = rng.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    },
    id() { let s = ''; for (let i = 0; i < 3; i++) s += Math.floor(rng.float() * 1679616).toString(36).padStart(4, '0'); return s; }
  });

  /* ---------- petits outils ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const util = (NEV.util = {
    clamp: (v, a, b) => Math.min(b, Math.max(a, v)),
    esc: (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    // Jour local au format AAAA-MM-JJ. NEV.__today permet de simuler une date (tests).
    todayStr(d) {
      if (!d && NEV.__today) return NEV.__today;
      d = d || new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    },
    parseDay(s) { const p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); },
    daysBetween(a, b) { return Math.round((util.parseDay(b) - util.parseDay(a)) / 86400000); },
    addDays(s, n) { const d = new Date(util.parseDay(s) + n * 86400000); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); },
    reduced() { return !!(g.matchMedia && g.matchMedia('(prefers-reduced-motion: reduce)').matches); },
    sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
    fmtTime(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + pad(sec % 60); },
    frDate(s) {
      const d = new Date(util.parseDay(s));
      return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
    }
  });

  /* ---------- transitions fondu flouté entre les pages ---------- */
  let leaving = false;
  NEV.go = function (url, delay) {
    if (leaving) return;
    leaving = true;
    doc.documentElement.classList.add('nev-leaving');
    setTimeout(function () { g.location.href = url; }, util.reduced() ? 0 : (delay == null ? 620 : delay));
  };
  doc.addEventListener('click', function (e) {
    const a = e.target.closest && e.target.closest('a[data-go]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    NEV.go(a.getAttribute('href'));
  });
  g.addEventListener('pageshow', function (e) {
    if (e.persisted) { leaving = false; doc.documentElement.classList.remove('nev-leaving'); }
  });

  /* ---------- SHA-256 (repli si crypto.subtle est absent) ---------- */
  function sha256hex(str) {
    const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
    const bytes = unescape(encodeURIComponent(str)).split('').map((c) => c.charCodeAt(0));
    const l = bytes.length;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    const hi = Math.floor((l * 8) / 4294967296), lo = (l * 8) >>> 0;
    bytes.push(hi >>> 24 & 255, hi >>> 16 & 255, hi >>> 8 & 255, hi & 255, lo >>> 24 & 255, lo >>> 16 & 255, lo >>> 8 & 255, lo & 255);
    let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a, h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let i = 0; i < bytes.length; i += 64) {
      const w = new Array(64);
      for (let j = 0; j < 16; j++) w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) | (bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
      for (let j = 16; j < 64; j++) {
        const s0 = rotr(w[j - 15], 7) ^ rotr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
        const s1 = rotr(w[j - 2], 17) ^ rotr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
      }
      let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, gg = h6, h = h7;
      for (let j = 0; j < 64; j++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25), ch = (e & f) ^ (~e & gg);
        const t1 = (h + S1 + ch + K[j] + w[j]) | 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) | 0;
        h = gg; gg = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + gg) | 0; h7 = (h7 + h) | 0;
    }
    return [h0, h1, h2, h3, h4, h5, h6, h7].map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
  }
  NEV.sha256 = sha256hex;
  const hex = (u8) => Array.prototype.map.call(u8, (b) => b.toString(16).padStart(2, '0')).join('');

  async function hashPw(pw, salt) {
    const c = g.crypto;
    if (c && c.subtle && g.TextEncoder) {
      try {
        const enc = new TextEncoder();
        const key = await c.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
        const bits = await c.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256);
        return 'p1:' + hex(new Uint8Array(bits));
      } catch (e) { /* repli ci-dessous */ }
    }
    let h = sha256hex(salt + pw);
    for (let i = 0; i < 4000; i++) h = sha256hex(h + salt);
    return 's1:' + h;
  }

  /* ---------- comptes (enregistrés sur l'appareil) ---------- */
  const USERS = 'nev.users', SESSION = 'nev.session';
  const auth = (NEV.auth = {
    _users() { return NEV.store.get(USERS, {}); },
    validate(f) {
      const email = String(f.email || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return { field: 'email', msg: 'Entre une adresse email valide.' };
      return null;
    },
    codeOf(id) { return 'NEV' + String(id).replace(/[^a-z0-9]/gi, '').slice(-5).toUpperCase(); },
    check(f) {
      const email = String(f.email || '').trim().toLowerCase();
      const pseudo = String(f.pseudo || '').trim();
      if (pseudo.length < 2 || pseudo.length > 20) return { ok: false, field: 'pseudo', error: 'Ton pseudo doit faire entre 2 et 20 caractères.' };
      const bad = auth.validate({ email });
      if (bad) return { ok: false, field: bad.field, error: bad.msg };
      if (String(f.password || '').length < 8) return { ok: false, field: 'password', error: 'Le mot de passe doit faire au moins 8 caractères.' };
      if (f.password !== f.password2) return { ok: false, field: 'password2', error: 'Les deux mots de passe ne sont pas identiques.' };
      if (!f.consent) return { ok: false, field: 'consent', error: 'Coche la case pour confirmer que tu as lu le conseil de sécurité.' };
      if (!f.terms) return { ok: false, field: 'terms', error: 'Coche la case pour accepter les conditions d\'utilisation et la politique de confidentialité.' };
      return { ok: true, email, pseudo };
    },
    async signup(f) {
      const c = auth.check(f);
      if (!c.ok) return c;
      if (NEV.cloud && NEV.cloud.mode === 'server') return NEV.cloud.serverSignup(Object.assign({}, f, { email: c.email, pseudo: c.pseudo }));
      const users = auth._users();
      if (users[c.email]) return { ok: false, field: 'email', error: 'Un compte existe déjà avec cet email. Connecte-toi.' };
      const salt = rng.id();
      const id = 'u' + rng.id();
      const user = { id, email: c.email, pseudo: c.pseudo, salt, hash: await hashPw(f.password, salt), created: util.todayStr(), code: auth.codeOf(id), refCount: 0 };
      const ref = String(f.ref || '').trim().toUpperCase();
      let refUser = null;
      if (ref) {
        refUser = Object.keys(users).map((k) => users[k]).find((u) => u.code === ref);
        if (!refUser) return { ok: false, field: 'ref', error: 'Ce code de parrainage n\'existe pas (tu peux laisser la case vide).' };
        user.refBy = refUser.id;
        refUser.refCount = (refUser.refCount || 0) + 1;
      }
      users[c.email] = user;
      NEV.store.set(USERS, users);
      NEV.store.set(SESSION, { uid: user.id, email: c.email, at: Date.now() });
      if (refUser) { const p = P.load(user.id); p.ref.by = ref; P.save(p, user.id); }
      if (NEV.track) NEV.track('signup', { ref: !!refUser });
      return { ok: true, user: auth.current() };
    },
    async login(email, password) {
      email = String(email || '').trim().toLowerCase();
      if (NEV.cloud && NEV.cloud.mode === 'server') return NEV.cloud.serverLogin(email, String(password || ''));
      const u = auth._users()[email];
      if (!u) return { ok: false, field: 'email', error: 'Aucun compte avec cet email.' };
      if (u.banned) return { ok: false, field: 'email', error: 'Ce compte est suspendu. Écris-nous pour en savoir plus.' };
      const h = await hashPw(String(password || ''), u.salt);
      if (h !== u.hash) return { ok: false, field: 'password', error: 'Mot de passe incorrect.' };
      NEV.store.set(SESSION, { uid: u.id, email, at: Date.now() });
      if (NEV.track) NEV.track('login', {});
      return { ok: true, user: auth.current() };
    },
    current() {
      const s = NEV.store.get(SESSION, null);
      if (!s) return null;
      const u = auth._users()[s.email];
      if (!u || u.id !== s.uid) return null;
      return { id: u.id, email: u.email, pseudo: u.pseudo, created: u.created, code: u.code || auth.codeOf(u.id), refCount: u.refCount || 0 };
    },
    logout() { NEV.store.del(SESSION); if (NEV.cloud && NEV.cloud.mode === 'server') NEV.cloud.serverLogout(); },
    require() {
      const u = auth.current();
      if (!u) { NEV.go('connexion.html', 0); return null; }
      return u;
    }
  });

  /* ---------- niveau selon le maximum de pompes ---------- */
  const LEVELS = [
    { n: 1, name: 'Éveil', range: '1 à 5 pompes', desc: 'On pose les bases, en douceur.' },
    { n: 2, name: 'Initié', range: '6 à 15 pompes', desc: 'Les mouvements deviennent réguliers.' },
    { n: 3, name: 'Combattant', range: '16 à 30 pompes', desc: 'Tu tiens le rythme, on monte l\'intensité.' },
    { n: 4, name: 'Guerrier', range: '31 à 50 pompes', desc: 'Du volume, de la technique, du caractère.' },
    { n: 5, name: 'Légende', range: '51 pompes et plus', desc: 'Le haut du tableau : charges maximales.' }
  ];
  NEV.LEVELS = LEVELS;
  NEV.levelFromMax = function (x) {
    x = Math.round(Number(x));
    const n = x <= 5 ? 1 : x <= 15 ? 2 : x <= 30 ? 3 : x <= 50 ? 4 : 5;
    return LEVELS[n - 1];
  };
  const HERO = [
    { n: 1, name: 'Maigrichon', xp: 0 }, { n: 2, name: 'Éveillé', xp: 100 }, { n: 3, name: 'Athlète', xp: 300 },
    { n: 4, name: 'Costaud', xp: 700 }, { n: 5, name: 'Colosse', xp: 1400 }, { n: 6, name: 'Légende', xp: 2600 }
  ];
  NEV.HERO_STAGES = HERO;
  NEV.heroFromXp = function (xp) {
    let s = HERO[0];
    for (const h of HERO) if (xp >= h.xp) s = h;
    const next = HERO[s.n] || null;
    return { stage: s, next, pct: next ? util.clamp((xp - s.xp) / (next.xp - s.xp), 0, 1) : 1 };
  };

  /* ---------- profil du joueur : réglages, série, jour raté ---------- */
  const defaults = () => ({
    v: 1,
    maxPushups: null, level: null,
    setup: { focus: 'equilibre', sets: 3, camera: true, zones: [], equip: { chair: true, wall: true, bag: false, step: false, bottle: false, towel: false, bar: false, table: false } },
    progress: { streak: 0, best: 0, lastDone: null, total: 0, xp: 0 },
    daily: null,
    spe: null,
    pity: 0,
    history: [],
    collection: {},
    flames: 0, flamesTotal: 0, bonusDraws: 0, gifts: [],
    login: { last: null, streak: 0, best: 0, days: [] },
    badges: {},
    ref: { count: 0, paid: 0, by: null, welcomed: false },
    aura: 'none', auras: ['none'],
    updated: 0
  });
  const P = (NEV.player = {
    key(uid) { return 'nev.p.' + uid; },
    load(uid) {
      uid = uid || (auth.current() || {}).id;
      if (!uid) return null;
      const p = NEV.store.get(P.key(uid), null);
      const d = defaults();
      if (!p) return d;
      p.setup = Object.assign(d.setup, p.setup || {});
      p.setup.equip = Object.assign(d.setup.equip, (p.setup || {}).equip || {});
      p.progress = Object.assign(d.progress, p.progress || {});
      p.history = p.history || [];
      p.collection = p.collection || {};
      p.login = Object.assign(d.login, p.login || {});
      p.ref = Object.assign(d.ref, p.ref || {});
      p.badges = p.badges || {};
      p.auras = p.auras || ['none'];
      return Object.assign(d, p, { setup: p.setup, progress: p.progress });
    },
    save(p, uid) {
      uid = uid || (auth.current() || {}).id;
      if (uid) {
        p.updated = Date.now();
        NEV.store.set(P.key(uid), p);
        if (NEV.cloud && NEV.cloud.mode === 'server') NEV.cloud.pushPlayer(p);
      }
      return p;
    },
    /* Nouveau jour : on regarde si un jour a été raté.
       Jour raté (écart de 2 jours ou plus depuis le dernier entraînement) :
       la série retombe à 0 et l'enchaînement d'aujourd'hui est doublé. */
    ensureDay(p, today) {
      today = today || util.todayStr();
      if (!p.spe || p.spe.date !== today) p.spe = { date: today, zone: null, card: null, status: 'none', result: null };
      if (p.daily && p.daily.date === today) return p;
      const last = p.progress.lastDone;
      const gap = last ? util.daysBetween(last, today) : 0;
      const missed = last && gap >= 2 ? gap - 1 : 0;
      if (missed >= 1) { p.progress.streakLost = p.progress.streak; p.progress.streak = 0; }
      p.daily = { date: today, status: 'none', missed, double: missed >= 1, card: null, result: null };
      return p;
    },
    /* Fait avancer la série d'aujourd'hui (une seule fois par jour). */
    _touch(p, today, rest) {
      const last = p.progress.lastDone;
      if (last === today) return false;
      const gap = last ? util.daysBetween(last, today) : 0;
      p.progress.streak = (last && gap === 1) ? p.progress.streak + 1 : 1;
      p.progress.best = Math.max(p.progress.best, p.progress.streak);
      if (!rest) p.progress.total += 1; else p.progress.restDays = (p.progress.restDays || 0) + 1;
      p.progress.lastDone = today;
      return true;
    },
    /* Enregistre la séance (du jour ou de Spécialisation) et fait avancer série, XP, collection.
       res : { reps, sets, verified, src: 'daily' | 'spe' | 'combo', rest: true pour une carte Repos }.
       Le Repos garde la série mais ne compte pas comme un jour d'entraînement. */
    complete(p, res, today) {
      today = today || util.todayStr();
      P.ensureDay(p, today);
      res = res || {};
      const src = res.src === 'spe' ? 'spe' : 'daily';
      const slot = src === 'spe' ? p.spe : p.daily;
      const d = p.daily;
      if (slot.status === 'done') return { already: true, xpGain: 0, p };
      const card = slot.card;
      const isRest = !!(res.rest || (card && card.special === 'repos'));
      const tier = card ? card.tier : 1;
      const verified = res.verified !== false;
      const dayDone = d.status === 'done';
      let xpGain = isRest ? 20 : Math.round((30 + 20 * tier) * (d.double && !dayDone ? 1.5 : 1) * (verified ? 1 : 0.5));
      if (src === 'spe' && dayDone && !isRest) xpGain = Math.round(xpGain * 0.6); // bonus : une 2e séance rapporte moins
      const touched = P._touch(p, today, isRest);
      p.progress.xp += xpGain;
      slot.status = 'done';
      slot.result = { reps: res.reps, sets: res.sets, verified: !!verified, at: Date.now(), xpGain, rest: isRest };
      if (!dayDone) { // la séance règle aussi la journée (la Spécialisation peut remplacer la carte du jour)
        d.status = 'done'; d.result = Object.assign({ via: src }, slot.result);
      }
      if (card) {
        if (!isRest) p.collection[card.id] = (p.collection[card.id] || 0) + 1;
        p.history.unshift({ date: today, id: card.id, name: card.name, rarity: card.rarity, tier, reps: res.reps, sets: res.sets, verified: !!verified, doubled: !!(d.double && !dayDone), xpGain, src, rest: isRest, special: card.special || null });
        p.history = p.history.slice(0, 160);
      } else if (res.combo) {
        p.history.unshift({ date: today, id: 'combo:' + res.combo.id, name: res.combo.name, rarity: 'combo', tier: 1, reps: res.reps, sets: res.sets, verified: !!verified, doubled: false, xpGain, src: 'combo', rest: false });
        p.history = p.history.slice(0, 160);
      }
      return { already: false, xpGain, p, touched };
    },
    /* Séance « combo » (enchaînement libre) : XP selon le volume, la série avance si ce n'est pas déjà fait. */
    completeCombo(p, combo, res, today) {
      today = today || util.todayStr();
      P.ensureDay(p, today);
      res = res || {};
      const d = p.daily;
      const dayDone = d.status === 'done';
      const verified = res.verified !== false;
      let xpGain = Math.round((20 + 12 * (combo.items || []).length) * (verified ? 1 : 0.5));
      if (dayDone) xpGain = Math.round(xpGain * 0.6);
      P._touch(p, today, false);
      p.progress.xp += xpGain;
      if (!dayDone) {
        // un combo remplace la carte du jour s'il n'y en a pas de commencée ; la journée est alors validée
        d.status = 'done'; d.result = { via: 'combo', reps: res.reps, sets: res.sets, verified: !!verified, at: Date.now(), xpGain };
      }
      p.history.unshift({ date: today, id: 'combo:' + combo.id, name: combo.name, rarity: 'combo', tier: 1, reps: res.reps, sets: res.sets, verified: !!verified, doubled: false, xpGain, src: 'combo', rest: false });
      p.history = p.history.slice(0, 160);
      return { already: false, xpGain, p };
    }
  });
})(window);
</script>
<script>/* cloud.js */
/* ==========================================================
   neV.BOOSTER — cloud.js
   Le « branchement » du site. Deux modes, détectés tout seuls :
   - serveur : le site est servi par server/server.js (/api/health répond).
               Comptes, progression, chat, combos et badges sont alors
               partagés entre tous les joueurs, mots de passe hachés
               côté serveur (scrypt), session en cookie HttpOnly.
   - local   : site ouvert depuis un dossier ou un hébergement statique.
               Tout est enregistré dans ce navigateur (mode démo) : les
               joueurs d'un même appareil se voient, rien ne sort.
   Les pages utilisent NEV.ready(fn) puis NEV.cloud.* sans se soucier du mode.
   ========================================================== */
(function (g) {
  'use strict';
  const NEV = (g.NEV = g.NEV || {});
  const doc = g.document, store = NEV.store, util = NEV.util, rng = NEV.rng;
  const me = doc.currentScript;
  const ROOT = (function () { try { return new URL('..', me.src).href; } catch (e) { return ''; } })();
  const C = (NEV.cloud = { mode: 'local', info: null, root: ROOT });
  const pageName = (g.location.pathname.split('/').pop() || 'index.html').replace('.html', '') || 'index';

  /* ---------- appel d'API ---------- */
  async function api(path, method, body) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const to = ctl ? setTimeout(function () { ctl.abort(); }, 9000) : 0;
    try {
      const r = await fetch(ROOT + 'api/' + path, {
        method: method || 'GET', credentials: 'same-origin', cache: 'no-store', signal: ctl ? ctl.signal : undefined,
        headers: Object.assign({ 'X-NEV': '1' }, body ? { 'Content-Type': 'application/json' } : {}),
        body: body ? JSON.stringify(body) : undefined
      });
      let data = null; try { data = await r.json(); } catch (e) { /* corps vide */ }
      return { ok: r.ok, status: r.status, data: data || {} };
    } catch (e) {
      return { ok: false, status: 0, data: { error: 'Le serveur ne répond pas. Vérifie ta connexion.' } };
    } finally { clearTimeout(to); }
  }
  C.api = api;

  /* ---------- détection du mode ---------- */
  C.ready = (async function () {
    if (g.location.protocol === 'file:') return 'local';
    try {
      const r = await Promise.race([api('health'), new Promise(function (res) { setTimeout(function () { res({ ok: false }); }, 2500); })]);
      if (r.ok && r.data && r.data.app === 'neV.BOOSTER') { C.mode = 'server'; C.info = r.data; }
    } catch (e) { /* mode local */ }
    return C.mode;
  })();
  NEV.ready = function (fn) { return C.ready.then(fn); };

  /* ---------- suivi (pages vues, erreurs) ---------- */
  NEV.track = function (type, data) {
    try {
      const u = NEV.auth && NEV.auth.current ? NEV.auth.current() : null;
      if (C.mode === 'server') { api('event', 'POST', { type: type, page: pageName, data: data || {} }); return; }
      const ev = store.get('nev.events', []);
      ev.push({ t: Date.now(), type: type, page: pageName, uid: u ? u.id : null, name: u ? u.pseudo : null, data: data || {} });
      store.set('nev.events', ev.slice(-600));
    } catch (e) { /* le suivi ne doit jamais casser le site */ }
  };
  let errCount = 0;
  g.addEventListener('error', function (e) { if (errCount++ < 5) NEV.track('error', { msg: String(e.message || '').slice(0, 160), src: String(e.filename || '').split('/').pop(), line: e.lineno }); });
  g.addEventListener('unhandledrejection', function (e) { if (errCount++ < 5) NEV.track('error', { msg: String((e.reason && e.reason.message) || e.reason || '').slice(0, 160) }); });
  C.ready.then(function () { NEV.track('view', {}); });

  /* ====================================================================
     MODE SERVEUR : comptes et joueur
     ==================================================================== */
  const USERS = 'nev.users', SESSION = 'nev.session';
  function cacheServerUser(u, player) {
    const users = store.get(USERS, {});
    users[u.email] = Object.assign({ salt: '', hash: '', srv: true }, u);
    store.set(USERS, users);
    store.set(SESSION, { uid: u.id, email: u.email, at: Date.now(), srv: true });
    if (player) store.set(NEV.player.key(u.id), player);
  }
  C.serverSignup = async function (f) {
    const r = await api('signup', 'POST', { pseudo: f.pseudo, email: f.email, password: f.password, consent: !!f.consent, terms: !!f.terms, ref: f.ref || '', lang: (NEV.i18n && NEV.i18n.lang()) || 'fr' });
    if (!r.ok) return { ok: false, field: r.data.field, error: r.data.error || 'Inscription impossible pour le moment.' };
    cacheServerUser(r.data.user, r.data.player);
    return { ok: true, user: NEV.auth.current() };
  };
  C.serverLogin = async function (email, pw) {
    const r = await api('login', 'POST', { email: email, password: pw });
    if (!r.ok) return { ok: false, field: r.data.field || 'password', error: r.data.error || 'Connexion impossible.' };
    cacheServerUser(r.data.user, r.data.player);
    return { ok: true, user: NEV.auth.current() };
  };
  C.serverLogout = function () { api('logout', 'POST', {}); };

  // Au chargement d'une page : on vérifie la session et on récupère la progression du serveur.
  C.sync = async function () {
    if (C.mode !== 'server') return NEV.auth.current();
    const s = store.get(SESSION, null);
    if (!s) return null;
    const r = await api('me');
    if (r.status === 401) { store.del(SESSION); return null; }
    if (r.ok && r.data.user) {
      const local = store.get(NEV.player.key(r.data.user.id), null);
      const srv = r.data.player;
      cacheServerUser(r.data.user, (!local || !srv || (srv.updated || 0) >= (local.updated || 0)) ? srv : local);
      if (local && srv && (local.updated || 0) > (srv.updated || 0)) C.pushPlayer(local, true);
    }
    return NEV.auth.current();
  };

  let pushT = 0, lastP = null;
  C.pushPlayer = function (p, now) {
    lastP = p;
    clearTimeout(pushT);
    const go = function () { if (lastP) api('player', 'PUT', { player: lastP }); lastP = null; };
    if (now) go(); else pushT = setTimeout(go, 1200);
  };
  g.addEventListener('pagehide', function () { if (lastP && C.mode === 'server') { try { fetch(ROOT + 'api/player', { method: 'PUT', keepalive: true, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-NEV': '1' }, body: JSON.stringify({ player: lastP }) }); } catch (e) { /* ignoré */ } } });

  /* ====================================================================
     CONFIG PUBLIQUE : combos du coach, badges personnalisés, annonce
     ==================================================================== */
  C.config = async function () {
    if (C.mode === 'server') {
      const r = await api('config');
      return r.ok ? r.data : { combos: [], badges: [], announce: null };
    }
    return { combos: store.get('nev.combos', []).filter(function (c) { return c.published; }), badges: store.get('nev.badgedefs', []), announce: store.get('nev.announce', null) };
  };

  /* ====================================================================
     CHAT
     ==================================================================== */
  const cleanText = function (t) { return String(t || '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 280); };
  let lastSend = 0;
  C.chat = {
    // room : 'global' (tous les joueurs) ou 'coach' (ta conversation privée avec l'admin)
    async list(room) {
      if (C.mode === 'server') { const r = await api('chat?room=' + encodeURIComponent(room)); C.chat.gate = r.ok ? r.data.gate || null : null; return r.ok ? r.data.messages || [] : []; }
      C.chat.gate = null;
      const u = NEV.auth.current(); if (!u) return [];
      const key = room === 'coach' ? 'coach:' + u.id : 'global';
      return store.get('nev.chat', []).filter(function (m) { return m.room === key; }).slice(-120);
    },
    async send(room, text) {
      text = cleanText(text);
      if (!text) return { ok: false, error: 'Écris un message.' };
      if (Date.now() - lastSend < 1200) return { ok: false, error: 'Doucement : un message à la fois.' };
      if (NEV.Policy) { const mod = NEV.Policy.moderate(text); if (!mod.ok) return { ok: false, error: mod.error }; text = mod.text; }
      lastSend = Date.now();
      if (C.mode === 'server') { const r = await api('chat', 'POST', { room: room, text: text }); return r.ok ? { ok: true } : { ok: false, error: r.data.error || 'Message non envoyé.' }; }
      const u = NEV.auth.current(); if (!u) return { ok: false, error: 'Connecte-toi.' };
      const all = store.get('nev.chat', []);
      all.push({ id: rng.id(), room: room === 'coach' ? 'coach:' + u.id : 'global', uid: u.id, name: u.pseudo, text: text, t: Date.now(), role: 'player' });
      store.set('nev.chat', all.slice(-400));
      return { ok: true };
    },
    // signaler un message du salon (serveur : 3 signalements différents le masquent et préviennent l'admin)
    async report(id, reason) {
      if (C.mode !== 'server') return { ok: true, local: true };
      const r = await api('chat/report', 'POST', { id: id, reason: reason || '' });
      return r.ok ? { ok: true } : { ok: false, error: r.data.error || 'Signalement impossible.' };
    }
  };

  /* ====================================================================
     ADMIN
     ==================================================================== */
  const A = (C.admin = {});
  const LA = 'nev.admin', LAS = 'nev.adminok';

  async function hashAdmin(pw, salt) {
    const enc = new TextEncoder();
    const key = await g.crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await g.crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 150000, hash: 'SHA-256' }, key, 256);
    return Array.prototype.map.call(new Uint8Array(bits), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  A.state = async function () { // { hasPassword, authed }
    if (C.mode === 'server') { const r = await api('admin/state'); return r.ok ? r.data : { hasPassword: true, authed: false }; }
    let ok = false; try { ok = g.sessionStorage.getItem(LAS) === '1'; } catch (e) { /* ignoré */ }
    return { hasPassword: !!store.get(LA, null), authed: ok };
  };
  A.login = async function (pw) {
    if (C.mode === 'server') { const r = await api('admin/login', 'POST', { password: pw }); return r.ok ? { ok: true } : { ok: false, error: r.data.error || 'Mot de passe refusé.' }; }
    const rec = store.get(LA, null);
    if (!rec) {
      if (String(pw).length < 10) return { ok: false, error: 'Choisis un mot de passe admin d\'au moins 10 caractères.' };
      const salt = rng.id() + rng.id();
      store.set(LA, { salt: salt, hash: await hashAdmin(pw, salt) });
    } else if ((await hashAdmin(pw, rec.salt)) !== rec.hash) {
      return { ok: false, error: 'Mot de passe refusé.' };
    }
    try { g.sessionStorage.setItem(LAS, '1'); } catch (e) { /* ignoré */ }
    return { ok: true };
  };
  A.logout = async function () {
    if (C.mode === 'server') await api('admin/logout', 'POST', {});
    try { g.sessionStorage.removeItem(LAS); } catch (e) { /* ignoré */ }
  };

  function localUsers() {
    const users = store.get(USERS, {});
    return Object.keys(users).map(function (k) {
      const u = users[k], p = NEV.player.load(u.id) || {};
      const prog = p.progress || {};
      return {
        id: u.id, email: u.email, pseudo: u.pseudo, created: u.created, banned: !!u.banned, code: u.code, refCount: u.refCount || 0, admin: !!u.isAdmin, bonusDraws: p.bonusDraws || 0,
        level: p.level, maxPushups: p.maxPushups, streak: prog.streak || 0, best: prog.best || 0, total: prog.total || 0, xp: prog.xp || 0,
        lastDone: prog.lastDone || null, flames: p.flames || 0, loginStreak: (p.login || {}).streak || 0, badges: Object.keys(p.badges || {}),
        lastSeen: (p.login || {}).last || null, history: (p.history || []).slice(0, 60), loginDays: (p.login || {}).days || []
      };
    });
  }

  function statsFrom(users, events, today) {
    const days = []; for (let i = 6; i >= 0; i--) days.push(util.addDays(today, -i));
    const sess = days.map(function () { return 0; }), act = days.map(function () { return new Set(); });
    const rar = [0, 0, 0, 0, 0], ex = {}; let verified = 0, total = 0, doubled = 0, nonQ = 0;
    users.forEach(function (u) {
      (u.history || []).forEach(function (h) {
        const i = days.indexOf(h.date);
        if (i >= 0) { sess[i]++; act[i].add(u.id); }
        if (h.tier >= 1 && h.tier <= 5) rar[h.tier - 1]++;
        ex[h.id] = (ex[h.id] || 0) + 1; total++; if (h.verified) verified++; if (h.doubled) doubled++; else nonQ++;
      });
      (u.loginDays || []).forEach(function (d) { const i = days.indexOf(d); if (i >= 0) act[i].add(u.id); });
    });
    const lv = [0, 0, 0, 0, 0]; users.forEach(function (u) { if (u.level >= 1 && u.level <= 5) lv[u.level - 1]++; });
    const day = 86400000, now = Date.now();
    return {
      players: users.length, newToday: users.filter(function (u) { return u.created === today; }).length,
      active: act.map(function (s) { return s.size; }), sessions: sess, days: days,
      avgStreak: users.length ? Math.round(10 * users.reduce(function (a, u) { return a + u.streak; }, 0) / users.length) / 10 : 0,
      bestStreak: users.reduce(function (a, u) { return Math.max(a, u.best); }, 0),
      levels: lv, rarity: rar, topExercises: Object.keys(ex).map(function (k) { return { id: k, n: ex[k] }; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 8),
      verifiedPct: total ? Math.round(100 * verified / total) : 0, sessionsTotal: total, doubled: doubled,
      flames: users.reduce(function (a, u) { return a + u.flames; }, 0), referrals: users.reduce(function (a, u) { return a + u.refCount; }, 0),
      errors24h: events.filter(function (e) { return e.type === 'error' && now - e.t < day; }).length,
      views24h: events.filter(function (e) { return e.type === 'view' && now - e.t < day; }).length,
      server: { mode: 'local', note: 'Mode démo : données de ce navigateur uniquement.' }
    };
  }

  A.users = async function () {
    if (C.mode === 'server') { const r = await api('admin/users'); return r.ok ? r.data.users : []; }
    return localUsers();
  };
  A.stats = async function () {
    if (C.mode === 'server') { const r = await api('admin/stats'); return r.ok ? r.data : null; }
    return statsFrom(localUsers(), store.get('nev.events', []), util.todayStr());
  };
  A.events = async function (type) {
    if (C.mode === 'server') { const r = await api('admin/events' + (type ? '?type=' + encodeURIComponent(type) : '')); return r.ok ? r.data.events : []; }
    const ev = store.get('nev.events', []).slice().reverse();
    return (type ? ev.filter(function (e) { return e.type === type; }) : ev).slice(0, 150);
  };
  A.ban = async function (uid, flag) {
    if (C.mode === 'server') { const r = await api('admin/ban', 'POST', { uid: uid, banned: !!flag }); return r.ok; }
    const users = store.get(USERS, {}); Object.keys(users).forEach(function (k) { if (users[k].id === uid) users[k].banned = !!flag; });
    store.set(USERS, users); return true;
  };

  // combos du coach
  A.combos = {
    async list() { if (C.mode === 'server') { const r = await api('admin/combos'); return r.ok ? r.data.combos : []; } return store.get('nev.combos', []); },
    async save(c) {
      if (C.mode === 'server') { const r = await api('admin/combos', 'POST', c); return r.ok ? r.data.combo : null; }
      const all = store.get('nev.combos', []);
      c = Object.assign({}, c); if (!c.id) c.id = 'c' + rng.id(); c.updated = Date.now();
      const i = all.findIndex(function (x) { return x.id === c.id; });
      if (i >= 0) all[i] = c; else all.unshift(c);
      store.set('nev.combos', all); return c;
    },
    async remove(id) {
      if (C.mode === 'server') { const r = await api('admin/combos/' + encodeURIComponent(id), 'DELETE'); return r.ok; }
      store.set('nev.combos', store.get('nev.combos', []).filter(function (x) { return x.id !== id; })); return true;
    }
  };
  // badges personnalisés
  A.badges = {
    async list() { if (C.mode === 'server') { const r = await api('admin/badges'); return r.ok ? r.data.badges : []; } return store.get('nev.badgedefs', []); },
    async save(b) {
      if (C.mode === 'server') { const r = await api('admin/badges', 'POST', b); return r.ok ? r.data.badge : null; }
      const all = store.get('nev.badgedefs', []);
      b = Object.assign({}, b); if (!b.id) b.id = 'b' + rng.id();
      const i = all.findIndex(function (x) { return x.id === b.id; });
      if (i >= 0) all[i] = b; else all.push(b);
      store.set('nev.badgedefs', all); return b;
    },
    async remove(id) {
      if (C.mode === 'server') { const r = await api('admin/badges/' + encodeURIComponent(id), 'DELETE'); return r.ok; }
      store.set('nev.badgedefs', store.get('nev.badgedefs', []).filter(function (x) { return x.id !== id; })); return true;
    },
    async grant(uid, badgeId) {
      if (C.mode === 'server') { const r = await api('admin/grant', 'POST', { uid: uid, badge: badgeId }); return r.ok; }
      const p = NEV.player.load(uid); p.badges[badgeId] = util.todayStr(); NEV.player.save(p, uid); return true;
    }
  };
  /* Cadeau : flammes et/ou tirages de gacha bonus. Serveur : fiche du joueur mise à jour + notification à sa prochaine visite. */

      el.innerHTML = '<div class="embers" aria-hidden="true">' + em + '</div><div class="card">' +
        (o.badge ? '<div class="bd">' + badgeSVG(o.badge, 120) + '</div>' : '<div class="fl">' + NEV.ui.icons.flame.replace('width="14" height="14"', 'width="64" height="64"') + '</div>') +

        '<button class="btn" type="button">Continuer</button></div>';
      doc.body.appendChild(el);

      el.querySelector('button').addEventListener('click', close);
      el.addEventListener('click', function (e) { if (e.target === el) close(); });
      setTimeout(function () { const b = el.querySelector('button'); if (b) b.focus(); }, 400);
    });
  }
  async function popups(fx) {
    if (fx.daily) {
      await popup({ kicker: 'Flamme du jour', title: fx.daily.streak > 1 ? fx.daily.streak + ' jours de connexion !' : 'Bienvenue !', sub: fx.daily.milestone ? 'Palier atteint : ' + fx.daily.milestone + '. Bonus de flammes !' : (fx.daily.lost ? 'Une nouvelle série démarre aujourd\'hui.' : 'Reviens demain pour allonger ta série de connexion.'), flames: fx.daily.gain });
    }

    }
    for (const b of fx.badges) await popup({ kicker: 'Nouveau badge', title: b.name, sub: b.desc, badge: b });
  }

  function setCustom(list) { custom = Array.isArray(list) ? list : []; }

  async function bootPublic(active) {

  }

  /* Démarrage commun des pages : mode serveur/local, session, niveau, flammes du jour, en-tête. */
  async function boot(active, opts) {
    opts = opts || {};

    const user = await NEV.cloud.sync();

    if (opts.needLevel !== false && !p.maxPushups) { NEV.go('niveau.html', 0); return null; }

  }

  const a11yLater = function () { clearTimeout(a11yT); a11yT = setTimeout(a11y, 250); };
  doc.addEventListener('DOMContentLoaded', a11yLater); g.addEventListener('load', a11yLater);

  sec('regles', '📜', 'Les règles du jeu',
    '<div class="kpi"><div><b>1</b><span>carte par jour</span></div><div><b>3 s</b><span>avant le début de la séance</span></div><div><b>×2</b><span>séries après un jour manqué</span></div><div><b>7</b><span>tirages max. sans carte rare (pitié)</span></div></div>' +
    '<ul><li><b>Une carte par jour</b> : tu ne peux pas retirer. Reviens demain.</li><li><b>Jour manqué</b> : le lendemain, le nombre de séries est <b>doublé</b>. C\'est la règle du jeu, pas une punition : le corps ne se rattrape pas, mais la discipline oui.</li><li><b>Raretés</b> : Commun (N), Rare (R), Épique (SR), Légendaire (UR), Mythique (MR). Plus ton niveau est élevé, plus les cartes fortes sortent. Les moins de 18 ans ne tirent ni Légendaire ni Mythique.</li><li><b>Pitié</b> : si tu enchaînes les cartes communes, une carte au moins Rare finit par sortir (douce à partir de 4 tirages, certaine au 7ᵉ).</li><li><b>Hasard</b> : le tirage utilise un générateur aléatoire sécurisé du navigateur, sans triche possible.</li><li><b>Cartes spéciales</b> : <b>Repos</b> (une vraie journée de récupération guidée) et <b>Tractions</b> (si tu as une barre ou une table solide). Elles sont très rares : environ 5 % si tu t\'es peu entraîné, jusqu\'à 40 % si tu as fait au moins 4 jours d\'entraînement sur les 7 derniers. Avec 10 pompes max, une carte Tractions te donne 5 tractions.</li></ul>' +
    '<h3>Niveaux selon ton maximum de pompes</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Niveau</th><th>Nom</th><th>Maximum de pompes</th></tr></thead><tbody>' +
    (NEV.LEVELS || []).map((l) => '<tr><td>' + l.n + '</td><td><b>' + esc(l.name) + '</b></td><td>' + esc(l.range) + '</td></tr>').join('') + '</tbody></table></div>');

  sec('recompenses', '🔥', 'Flammes, XP et héros',
    '<div class="cards"><div class="cardx"><span class="tag">Flammes</span><h4>Connexion quotidienne</h4><p>+1 flamme par jour de connexion, +4 bonus tous les 7 jours d\'affilée, +10 bonus tous les 30 jours.</p></div>' +
    '<div class="cardx"><span class="tag">Parrainage</span><h4>Invite tes amis</h4><p>Partage ton code : tu gagnes 50 flammes par ami inscrit, et lui 20 flammes de bienvenue.</p></div>' +

<script>/* i18n.js */
/* ==========================================================
   neV.BOOSTER — i18n.js : site multilingue
   Langues : français (d'origine), anglais, espagnol, portugais, arabe, chinois, hindi.
   Principe : le site est écrit en français ; dans une autre langue, un traducteur remplace les textes
   connus (paquet js/i18n-<langue>.js) dans la page, y compris ceux que les scripts affichent plus tard.
   - Langue : choix gardé sur l'appareil (et sur le compte en mode serveur) ; à la première visite,
     la langue du navigateur est proposée si elle fait partie de la liste, sinon français.
   - Arabe : la page passe en lecture de droite à gauche (dir="rtl").
   - Ne touche jamais au contenu des joueurs (pseudos, messages) : attribut translate="no".
   - Hors périmètre (reste en français) : textes juridiques, bibliothèque d'exercices, programmes,
     conseils, alimentation, tuto, messages d'erreur du serveur.
   - Traductions automatiques de qualité « correcte » : à faire relire par des locuteurs natifs.
   ========================================================== */
(function (g) {
  'use strict';
  const NEV = (g.NEV = g.NEV || {}), doc = g.document, KEY = 'nev.lang';
  const LANGS = { fr: ['Français', 'ltr'], en: ['English', 'ltr'], es: ['Español', 'ltr'], pt: ['Português', 'ltr'], ar: ['العربية', 'rtl'], zh: ['中文', 'ltr'], hi: ['हिन्दी', 'ltr'] };
  const FRDAYS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
  const FRMONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

  function pick() {
    let s = null; try { s = g.localStorage.getItem(KEY); } catch (e) { /* ignoré */ }
    if (s && LANGS[s]) return s;
    const nav = String((g.navigator && (g.navigator.language || (g.navigator.languages || [])[0])) || '').slice(0, 2).toLowerCase();

  const i18n = NEV.i18n = {
    lang: () => lang, langs: () => Object.keys(LANGS).map((c) => ({ code: c, name: LANGS[c][0] })),
    set(l) {
      l = LANGS[l] ? l : 'fr';
      try { g.localStorage.setItem(KEY, l); } catch (e) { /* ignoré */ }
      try { if (NEV.cloud && NEV.cloud.mode === 'server' && NEV.auth && NEV.auth.current && NEV.auth.current()) NEV.cloud.api('account/lang', 'POST', { lang: l }).catch(() => {}); } catch (e) { /* ignoré */ }
      g.setTimeout(() => g.location.reload(), 80);
    },
    t(s) { return P ? tr(s) : s; }
  };

  /* motifs des textes à chiffres (le français sert de clé) → gabarits du paquet */
  const D = '(\\d+)';
  const PATS = [
    ['date', /^(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche) (\d+) (janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)$/],
    ['greet', /^Salut (.+), prêt à$/], ['glasses', new RegExp('^' + D + ' / ' + D + ' verres$')],
    ['xpbefore', new RegExp('^' + D + ' / ' + D + ' XP avant « (.+) »$')], ['card', new RegExp('^Carte ' + D + ' · niveau (.+) · ≈ ' + D + ' min$')],
    ['stagelv', new RegExp('^(.+) · niveau ' + D + '$')], ['level', new RegExp('^Niveau ' + D + '$')],
    ['repsx', new RegExp('^— ' + D + ' × ' + D + ' rép\\.$')], ['perside', new RegExp('^— ' + D + ' × ' + D + ' par côté$')], ['repsn', new RegExp('^Répétitions \\(' + D + ' dernières\\)$')],
    ['wkstreak', new RegExp('^' + D + ' séances? · série ' + D + '$')], ['wkdone', new RegExp('^' + D + ' séances? validées?\\.?$')], ['wk', new RegExp('^' + D + ' séances?$')],
    ['days', new RegExp('^' + D + ' / ' + D + ' jours$')], ['wks', new RegExp('^' + D + ' / ' + D + ' séances$')], ['unit', new RegExp('^' + D + ' / ' + D + ' (répétitions|XP|séances caméra)$')],
    ['xpearned', new RegExp('^' + D + ' XP gagnés$')], ['daysleft', new RegExp('^' + D + ' jours restants$')],
    ['season', /^Saison (\d+|—) · (.+)$/], ['seasonstart', /^La saison 1 commence le (.+)$/], ['chalhead', /^Défi de la semaine · du (\S+) au (\S+)$/],
    ['seasongoal', new RegExp('^Fais ' + D + ' séances pendant la saison \\(six semaines\\) pour gagner ' + D + ' flammes\\.$')], ['claim', new RegExp('^Récupérer \\+' + D + ' flammes$')],
    ['you', /^(.+) \(toi\)$/], ['flamesav', new RegExp('^flammes disponibles · ' + D + ' gagnées au total$')], ['period', /^(Cette semaine|Ce mois|Cette saison) · (.+)$/],
    ['newacct', new RegExp('^Compte tout neuf : le salon s\'ouvre pour toi dans ' + D + ' min\\.$')], ['flames', new RegExp('^' + D + ' flammes$')],
    ['guarantee', new RegExp('^Niveau (\\d) « (.+) »\\. Tirages sans Épique d\'affilée : ' + D + '\\. Garantie Épique\\+ dans ' + D + ' tirages au plus tard\\.$')],
    ['fornow', new RegExp('^pour passer de 5 % à 40 %\\. Pour l\'instant : ' + D + ' jours?, donc$')], ['range', new RegExp('^' + D + ' à ' + D + ' pompes · (.+)$')], ['rangeplus', new RegExp('^' + D + ' pompes et plus · (.+)$')],
    ['dayn', new RegExp('^Jour ' + D + ' / ' + D + '$')], ['streakn', new RegExp('^🔥 ' + D + ' jours de suite$')], ['xptoday', new RegExp('^\\+' + D + ' XP du jour$')],
    ['likes', new RegExp('^♥ J\'aime ' + D + '$')], ['followers', new RegExp('^Abonnés \\+' + D + '$')], ['msgs', new RegExp('^Messages ' + D + '$')]
  ];

  function render(tpl, m) {
    return tpl.replace(/\{(t|wd|mo|p)?(\d)(?:\|([^|}]*)\|([^}]*))?\}/g, (all, kind, n, a, b) => {
      const v = m[Number(n)] || '';
      if (kind === 'p') return Number(v) === 1 ? a : b;
      if (kind === 't') return P.d[v] != null ? P.d[v] : v;
      if (kind === 'wd') return (P.wd && P.wd[FRDAYS.indexOf(v)]) || v;
      if (kind === 'mo') return (P.mo && P.mo[FRMONTHS.indexOf(v)]) || v;
      return v;
    });
  }
  function tr(raw) {
    const m = raw.match(/^(\s*)([\s\S]*?)(\s*)$/), core = m[2];
    if (!core) return raw;
    let out = P.d[core];
    if (out == null) for (let i = 0; i < PATS.length; i++) { const r = PATS[i][1].exec(core); if (r && P.x[PATS[i][0]]) { out = render(P.x[PATS[i][0]], r); break; } }
    return out == null ? raw : m[1] + out + m[3];
  }
  const skip = (n) => { for (let e = n.nodeType === 1 ? n : n.parentElement; e; e = e.parentElement) { if (e.getAttribute && e.getAttribute('translate') === 'no') return true; if (/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|CODE|PRE|SELECT|OPTION)$/.test(e.tagName)) return true; } return false; };
  const ATTRS = ['placeholder', 'aria-label', 'title', 'alt'];
  function walk(root) {
    if (!root) return;
    if (root.nodeType === 3) { if (!skip(root)) { const v = tr(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; } return; }
    if (root.nodeType !== 1 || skip(root)) return;
    const w = doc.createTreeWalker(root, 4 | 1, null); let n = root;
    do {
      if (n.nodeType === 3) { if (!skip(n)) { const v = tr(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; } }
      else if (n.nodeType === 1 && n.getAttribute && !skip(n)) ATTRS.forEach((a) => { const x = n.getAttribute(a); if (x) { const v = tr(x); if (v !== x) n.setAttribute(a, v); } });
    } while ((n = w.nextNode()));
  }
  function legalNote() {
    if (!/\/(conditions|confidentialite|mentions-legales)\.html$/.test(g.location.pathname)) return;
    const w = doc.querySelector('.hero-page') || doc.querySelector('.wrap'); if (!w || doc.getElementById('enLegal')) return;
    const p = doc.createElement('p'); p.id = 'enLegal'; p.className = 'muted'; p.setAttribute('translate', 'no');
    p.textContent = P.legal || ''; if (P.legal) w.appendChild(p);
  }
  function apply() {
    doc.documentElement.lang = lang; doc.documentElement.dir = LANGS[lang][1]; legalNote();
    if (doc.title) doc.title = tr(doc.title);
    walk(doc.body);
    if (g.MutationObserver) new g.MutationObserver((ms) => {
      ms.forEach((m) => { if (m.type === 'characterData') walk(m.target); else if (m.type === 'attributes') { const x = m.target.getAttribute(m.attributeName); if (x) { const v = tr(x); if (v !== x) m.target.setAttribute(m.attributeName, v); } } else m.addedNodes.forEach(walk); });
      if (doc.title) { const t = tr(doc.title); if (t !== doc.title) doc.title = t; }

  }

  /* sélecteur de langue (liste déroulante) : ajouté au pied de page dès qu'il existe */
  function switcher() {
    const f = doc.querySelector('.sitefoot nav') || doc.getElementById('langHost'); if (!f || f.querySelector('.langsw')) return;
    const s = doc.createElement('select'); s.className = 'langsw'; s.setAttribute('translate', 'no');
    s.setAttribute('aria-label', 'Langue / Language');

    s.addEventListener('change', () => i18n.set(s.value)); f.appendChild(s);
  }
  if (g.MutationObserver) new g.MutationObserver(switcher).observe(doc.documentElement, { childList: true, subtree: true });
  doc.addEventListener('DOMContentLoaded', switcher);

  if (lang !== 'fr') {
    const s = doc.createElement('script'); s.src = 'js/i18n-' + lang + '.js';
    s.onload = () => { P = (NEV.i18nPacks || {})[lang]; if (!P) return; const go = () => apply(); if (doc.body) go(); else doc.addEventListener('DOMContentLoaded', go); };
    doc.head.appendChild(s);
    doc.documentElement.dir = LANGS[lang][1];
  }
})(window);

<script>/* pwa.js */
/* neV.BOOSTER — appli installable, hors ligne, rappels (facultatifs)
   Rappels : le navigateur ne laisse pas un site réveiller ton téléphone sans service
   d'envoi (push) ; ici le rappel s'affiche quand tu ouvres l'appli après l'heure choisie
   si tu n'as pas encore fait ta séance du jour. C'est dit tel quel dans les réglages. */
(function (g) {
  'use strict';
  const NEV = (g.NEV = g.NEV || {}), doc = g.document;
  const KEY = 'nev.reminder';
  const head = doc.head;
  if (!doc.querySelector('link[rel=manifest]')) { const l = doc.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; head.appendChild(l); }
  if (!doc.querySelector('link[rel=apple-touch-icon]')) { const l = doc.createElement('link'); l.rel = 'apple-touch-icon'; l.href = 'img/apple-touch-icon.png'; head.appendChild(l); }

  let reg = null, deferred = null;
  const sw = ('serviceWorker' in g.navigator) && (g.location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(g.location.hostname));
  if (sw) g.navigator.serviceWorker.register('sw.js').then((r) => { reg = r; remind(); }).catch(() => {});
  g.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; banner(); });
  g.addEventListener('appinstalled', () => { deferred = null; const b = doc.getElementById('nevInstall'); if (b) b.remove(); try { g.localStorage.setItem('nev.installed', '1'); } catch (e) { /* ignoré */ } });

  /* Bandeau « Installer l'application » : Android / ordinateur (bouton direct) et iPhone (mode d'emploi). Une fois refusé, il ne revient pas avant 14 jours. */
  const DISMISS = 'nev.installNo';
  const ios = /iphone|ipad|ipod/i.test(g.navigator.userAgent) || (g.navigator.platform === 'MacIntel' && g.navigator.maxTouchPoints > 1);
  function banner() {
    if (doc.getElementById('nevInstall') || NEV.pwa && NEV.pwa.standalone()) return;
    if (!/(accueil|connexion|tuto)\.html$/.test(g.location.pathname)) return;
    try { const d = +g.localStorage.getItem(DISMISS) || 0; if (Date.now() - d < 14 * 864e5 || g.localStorage.getItem('nev.installed')) return; } catch (e) { /* ignoré */ }
    if (!deferred && !ios) return;
    const el = doc.createElement('div'); el.id = 'nevInstall'; el.className = 'nevinst'; el.setAttribute('role', 'region'); el.setAttribute('aria-label', 'Installer l\'application');
    el.innerHTML = '<img src="img/icon-192.png" alt="" width="44" height="44"><div class="t"><b>Installe l\'appli neV.BOOSTER</b><span>' +
      (deferred ? 'Plein écran, icône sur ton écran d\'accueil, pages vues hors ligne.' : 'Touche Partager puis « Sur l\'écran d\'accueil ».') + '</span></div>' +
      (deferred ? '<button type="button" class="btn sm" id="nevInstallGo">Installer</button>' : '') + '<button type="button" class="x" aria-label="Plus tard">✕</button>';
    doc.body.appendChild(el);
    const go = el.querySelector('#nevInstallGo'); if (go) go.onclick = async () => { const ok = await NEV.pwa.install(); if (ok) el.remove(); };
    el.querySelector('.x').onclick = () => { try { g.localStorage.setItem(DISMISS, String(Date.now())); } catch (e) { /* ignoré */ } el.remove(); };
  }
  if (ios) setTimeout(banner, 3000);

  const get = () => { try { return JSON.parse(g.localStorage.getItem(KEY)) || { on: false, hour: 18 }; } catch (e) { return { on: false, hour: 18 }; } };
  const set = (v) => { try { g.localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* ignoré */ } };
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  function remind() {
    const c = get(); if (!c.on || !reg || !g.Notification || g.Notification.permission !== 'granted') return;
    const now = new Date(); if (now.getHours() < c.hour || c.last === today()) return;
    let done = false; try { const p = NEV.player && NEV.player.load(); done = !!(p && (p.history || []).some((x) => x.date === today())); } catch (e) { /* ignoré */ }
    if (done) return;
    c.last = today(); set(c);
    reg.showNotification('neV.BOOSTER', { body: 'Ta séance du jour t\'attend : quelques minutes suffisent. 🔥', icon: 'img/icon-192.png', badge: 'img/icon-192.png', tag: 'nev-daily' });
  }

  NEV.pwa = {
    supported: sw,
    standalone: () => (g.matchMedia && g.matchMedia('(display-mode: standalone)').matches) || g.navigator.standalone === true,
    canInstall: () => !!deferred,
    install: async () => { if (!deferred) return false; deferred.prompt(); const r = await deferred.userChoice; deferred = null; return r.outcome === 'accepted'; },
    notifSupported: () => !!g.Notification && sw,
    reminder: get,
    setReminder: async (on, hour) => {
      const c = get(); c.hour = Math.min(23, Math.max(5, Number(hour) || 18));
      if (on) { const p = g.Notification.permission === 'granted' ? 'granted' : await g.Notification.requestPermission(); c.on = p === 'granted'; } else c.on = false;
      set(c); return c;
    }
  };
})(window);
</script>
