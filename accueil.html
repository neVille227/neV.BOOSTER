<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0507">
<title>neV.BOOSTER — Accueil</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/nev.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/light.css">
<link rel="stylesheet" href="css/tour.css">
<style>
  .hh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .hh .pillrow{display:flex;gap:10px}
  .pillx{padding:9px 16px;border-radius:99px;background:#ffffff0a;border:1px solid #ffffff1c;font-weight:800;font-size:.82rem;white-space:nowrap}
  html[data-theme=light] .pillx{border-color:var(--line);background:#00000005}
  .dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-top:22px;align-items:stretch}
  .col{display:grid;gap:18px;align-content:start}
  .col>.panel{margin:0}
  .today h2{font-size:1.45rem;font-weight:900;margin:6px 0 8px;letter-spacing:-.02em}
  .today .muted{margin:0 0 14px;font-size:.88rem}
  .today .acts{display:grid;gap:10px}
  .today .acts a{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px 16px;border-radius:99px;font-weight:800;text-decoration:none;font-size:.95rem}
  .today .acts .b1{background:var(--grad-btn);color:#fff}
  .today .acts .b2{border:1px solid #f0b84a55;background:#f0b84a14;color:#f6c76a}
  .miniCard{display:flex;gap:16px;align-items:center;margin:14px 0;padding:14px;border-radius:16px;border:1px solid var(--c,#fff3);background:linear-gradient(135deg,#ffffff0a,#00000033)}
  .miniCard .tier{width:62px;height:84px;border-radius:10px;background:linear-gradient(160deg,var(--c),var(--c2));display:grid;place-items:center;font-weight:900;font-size:1.3rem;color:#1a0508;box-shadow:0 0 22px var(--g)}
  .miniCard b{font-size:1.1rem}.miniCard span{display:block;color:var(--muted);font-size:.84rem}
  .heroBox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:520px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#e0455f30,transparent 65%),var(--panel)}
  .heroBox .eyebrow{letter-spacing:.2em}
  .heroBox .stage{width:100%;max-width:320px;margin:10px 0}
  .heroBox .name{font-weight:900;font-size:1.35rem;margin-top:6px}
  .heroBox .bar{width:86%;margin:12px auto 6px}
  .heroBox small{color:var(--muted)}
  .coachC{border-radius:20px;padding:20px;background:linear-gradient(135deg,#a62445,#ff7043);color:#fff}
  .coachC .tg{display:inline-block;padding:5px 12px;border-radius:99px;background:#0000004d;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
  .coachC h3{margin:12px 0;font-size:1.15rem;font-weight:900;line-height:1.25}
  .coachC a{display:inline-block;padding:11px 18px;border-radius:99px;background:#000;color:#fff;font-weight:800;text-decoration:none;font-size:.88rem}
  .chain{border-radius:16px;padding:16px 18px;background:#f0b84a14;border:1px solid #f0b84a44;font-size:.88rem;line-height:1.5}
  .chain b{display:block;color:#f6c76a;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .chain.ok{background:#3ddc8414;border-color:#3ddc8444}.chain.ok b{color:#6df0a7}
  .rec h2,.qdc h2{font-size:1.1rem;margin:0}
  .rec .hd,.qdc .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .rec .hd a,.qdc .hd a{font-weight:800;font-size:.85rem;color:var(--red);text-decoration:none}
  .rl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .rl a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#ffffff08;text-decoration:none;color:inherit}
  html[data-theme=light] .rl a{background:#00000005}
  .rl .ini{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#8c1632,#4b0b1b);display:grid;place-items:center;font-weight:900;flex:none;color:#fff}
  .rl b{display:block;font-size:.9rem}.rl span{display:block;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rl .t{min-width:0}
  .qd{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
  .qd li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#ffffff08;font-weight:700;font-size:.9rem}
  html[data-theme=light] .qd li{background:#00000005}
  .qd .ck{width:26px;height:26px;border-radius:8px;border:2px solid #ffffff44;background:none;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
  .qd li.done .ck{background:var(--red);border-color:var(--red)}.qd li.done b{text-decoration:line-through;opacity:.6}
  .qd li span{font-weight:600}
  .qd li small{display:none}
  @media(max-width:1100px){.dash{grid-template-columns:1fr 1fr}.col.c2{grid-column:1/-1;order:-1}}
  @media(max-width:700px){
    .dash{grid-template-columns:1fr;gap:14px}
    .col{display:contents}
    .col.c2{order:1}.c-today{order:2}.c-coach{order:3}.c-chain{order:4}.c-qd{order:5}.c-rec{order:6}
    .heroBox{min-height:0;padding:22px 16px}.heroBox .stage{max-width:240px}
    .coachC{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:99px;flex-wrap:nowrap}
    .coachC h3{margin:0;font-size:.95rem;flex:1}.coachC a{display:none}
  }
</style>
</head>
<body>
<div class="page"><div class="wrap">
  <div class="hh"><div><div class="eyebrow" id="date">Aujourd'hui</div>
  <h1 class="big" id="hello">Salut, prêt à <em>booster</em> ?</h1></div>
  <div class="pillrow"><span class="pillx" id="pFl">Flammes · 0</span><span class="pillx" id="pXp">XP · 0</span></div></div>

  <div class="dash">
    <div class="col c1">
      <section class="panel glow today c-today" id="today"></section>
      <section class="panel qdc c-qd" id="qd" aria-labelledby="qdT"></section>
    </div>
    <div class="col c2">
      <section class="panel heroBox" id="heroBox"><div class="eyebrow">Ton avatar</div><div class="stage" id="hero"></div><div class="name" id="heroName"></div><div class="bar"><i id="heroBar" style="width:0"></i></div><small id="heroXp"></small></section>
    </div>
    <div class="col c3">
      <section class="coachC c-coach" id="coachC"><span class="tg">Annonce du coach</span><h3 id="coachT">Il y a un défi, va le voir.</h3><a href="defis.html" data-go>Voir le défi</a></section>
      <section class="chain c-chain" id="alert"></section>
      <section class="panel rec c-rec" id="rec"></section>
    </div>
  </div>
</div></div>
<script src="js/core.js"></script>
<script src="js/cloud.js"></script>
<script src="js/rewards.js"></script>
<script src="js/ui.js"></script>
<script src="js/ex-data.js"></script>
<script src="js/ex-anim.js"></script>
<script src="js/ex-more.js"></script>
<script src="js/ex-extra.js"></script>
<script src="js/exercises.js"></script>
<script src="js/zones.js"></script>
<script src="js/gachaengine.js"></script>
<script src="js/figure.js"></script>
<script src="js/hero.js"></script>
<script src="js/figure3d.js"></script>
<script src="js/hero3d.js"></script>
<script src="js/avatar-illus.js"></script>
<script src="js/hero-img.js"></script>
<script src="js/p-accueil.js"></script>
<script src="js/tour.js"></script>
<script src="js/i18n.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
