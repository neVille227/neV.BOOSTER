<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0507">
<title>neV.BOOSTER — Spécialisation</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/nev.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/light.css">
<link rel="stylesheet" href="css/lib.css">
<link rel="stylesheet" href="css/specialisation.css">
</head>
<body>
<div class="page"><div class="wrap spe">
  <!-- 1 · notre vision, qui s'écrit à l'écran -->
  <section class="spe-vision" id="vision" aria-labelledby="visTitle">
    <div class="eyebrow">Notre vision</div>
    <h1 class="spe-t" id="visTitle" aria-live="off"></h1>
    <p class="spe-p" id="visText"></p>
    <ul class="spe-l" id="visList"></ul>
    <button type="button" class="spe-skip" id="visSkip">Passer ›</button>
  </section>

  <!-- 2 · le corps, face et dos : on touche la zone voulue -->
  <section class="spe-body" id="body" hidden aria-labelledby="bodyTitle">
    <div class="eyebrow">Spécialisation</div>
    <h2 class="big" id="bodyTitle">Touche la zone que tu veux <em>travailler</em></h2>
    <p class="lead">Choisis une partie du corps, de face ou de dos : tu arrives directement sur ses exercices et ses combos.</p>
    <div class="bmap spe-map" id="bmap"></div>
    <p class="muted spe-hint"><button type="button" class="spe-replay" id="visAgain">↺ Revoir notre vision</button></p>
  </section>
</div></div>

<script src="js/core.js"></script>
<script src="js/cloud.js"></script>

</body>
</html>
