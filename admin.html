<style>/* nev.css */
/* ==========================================================
   neV.BOOSTER — feuille de style commune
   Palette : rouge vin → rouge effort → braise → or
   ========================================================== */
:root{
  --bg:#0a0507; --bg2:#14080c;
  --wine:#7a0f26; --wine2:#4a0a1a; --red:#e0455f; --ember:#ff8a3d; --gold:#f0b24a;
  --cream:#fff1f2; --rose:#f3a6b0; --muted:#c2a3aa; --line:#4a2029;
  --ok:#3ddc84; --ok2:#16a34a; --danger:#ff7a8a;
  --panel:rgba(30,11,17,.78); --panel2:#2a1118;
  --grad-effort:linear-gradient(135deg,#4a0a1a 0%,#8e1b3c 42%,#e0455f 78%,#ff8a3d 100%);
  --grad-btn:linear-gradient(135deg,#8e1b3c,#e0455f 70%,#ff6a4d);
  --r:18px; --maxw:1120px;
  --f:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--cream);font-family:var(--f);line-height:1.5;
  background:radial-gradient(1100px 700px at 88% -12%,#5e1026 0,transparent 62%),radial-gradient(900px 600px at -5% 112%,#3a0a18 0,transparent 58%),var(--bg);
  background-attachment:fixed;
  animation:nevIn .85s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes nevIn{from{opacity:0;filter:blur(16px) brightness(1.7) saturate(1.4)}to{opacity:1;filter:none}}
.nev-leaving body{animation:none;transition:opacity .6s ease,filter .6s ease;opacity:0;filter:blur(16px) brightness(1.7) saturate(1.4);pointer-events:none}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.1;margin:0}
.wrap{width:min(var(--maxw),92%);margin:0 auto}
.page{padding:48px 0 110px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- en-tête et navigation ---------- */
.hdr{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:linear-gradient(180deg,#0a0507e6,#0a050799);border-bottom:1px solid #ffffff12}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 0}
.logo{font-weight:900;letter-spacing:.06em;font-size:1.15rem;text-decoration:none;white-space:nowrap}
.logo span{color:var(--red)}
.me{display:flex;align-items:center;gap:10px;font-size:.82rem;font-weight:700}
.me .flame{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;background:#ff8a3d1f;border:1px solid #ff8a3d55;color:#ffc89a}
.me .who{color:var(--rose);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{background:none;border:1px solid #ffffff22;color:var(--muted);border-radius:99px;padding:6px 11px;font-size:.76rem}
.me button:hover{color:#fff;border-color:#fff6}

/* ---------- composants ---------- */
.eyebrow{color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.18em;font-size:.72rem}
h1.big{font-size:clamp(2rem,5.4vw,3.6rem);font-weight:900;letter-spacing:-.035em}
h1.big em,h2 em{font-style:normal;background:var(--grad-effort);-webkit-background-clip:text;background-clip:text;color:transparent;filter:saturate(1.3) brightness(1.25)}
h2.sec{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:64px 0 24px}
.lead{color:var(--muted);max-width:640px;font-size:1.02rem}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:30px;box-shadow:0 18px 50px #0006}
.panel.glow{box-shadow:0 0 0 1px #e0455f55,0 20px 60px #e0455f22}
.grid{display:grid;gap:26px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:800;font-size:.95rem;text-decoration:none;color:#fff;background:var(--grad-btn);box-shadow:0 10px 28px #e0455f40;transition:transform .18s,filter .18s,box-shadow .18s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:#ffffff0d;box-shadow:inset 0 0 0 1px #ffffff26;color:var(--cream)}
.btn.gold{background:linear-gradient(135deg,#f0b24a,#ff8a3d);color:#2a0d05;box-shadow:0 10px 28px #f0b24a40}
.btn.ok{background:linear-gradient(135deg,#16a34a,#3ddc84);color:#04260f;box-shadow:0 10px 28px #3ddc8440}
.btn.sm{padding:8px 14px;font-size:.8rem;border-radius:11px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:.74rem;font-weight:700;background:#ffffff0f;border:1px solid #ffffff1c;color:var(--rose)}
.chip.red{background:#e0455f22;border-color:#e0455f66;color:#ffb3bd}
.chip.gold{background:#f0b24a1c;border-color:#f0b24a55;color:var(--gold)}
.chip.ok{background:#3ddc8420;border-color:#3ddc8466;color:#9af0c0}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.field label{font-size:.8rem;font-weight:700;color:#ffdfe3}
.field input,.field select,.field textarea{background:#1c0b11;border:1px solid var(--line);border-radius:13px;padding:13px 14px;outline:none;transition:.2s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #e0455f2e}
.field .hint{font-size:.74rem;color:var(--muted)}
.field.bad input{border-color:var(--danger)}
.err{color:var(--danger);font-size:.84rem;font-weight:600;min-height:1.2em;margin:4px 0 10px}

<script>/* core.js */
/* ==========================================================
   neV.BOOSTER — core.js
   Stockage, aléatoire, transitions, comptes, niveau, série.
   Tout passe par l'objet global NEV (pas de modules : le site
   fonctionne aussi s'il est ouvert depuis un simple dossier).
   ========================================================== */
(function (g) {
  'use strict';
  const NEV = (g.NEV = g.NEV || {});
  const doc = g.document;

  /* ---------- stockage (localStorage, avec repli mémoire) ---------- */
  const mem = {};
  let ls = null;
  try { ls = g.localStorage; ls.setItem('nev.t', '1'); ls.removeItem('nev.t'); } catch (e) { ls = null; }
  NEV.store = {
    get(k, d) {
      try { const v = ls ? ls.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; }
    },
    set(k, v) {
      try { const s = JSON.stringify(v); if (ls) ls.setItem(k, s); else mem[k] = s; } catch (e) { /* quota ou mode privé */ }
    },
    del(k) { try { if (ls) ls.removeItem(k); else delete mem[k]; } catch (e) { /* ignoré */ } },
    persistent: !!ls
  };

  /* ---------- aléatoire (crypto du navigateur) ---------- */
  const rng = (NEV.rng = {
    float() {
      const c = g.crypto || g.msCrypto;

      }

    },
    int(n) { return Math.floor(rng.float() * n); },
    pick(arr) { return arr[rng.int(arr.length)]; },
    weighted(weights) {
      let total = 0; for (const w of weights) total += Math.max(0, w);
      let r = rng.float() * total;
      for (let i = 0; i < weights.length; i++) { r -= Math.max(0, weights[i]); if (r < 0) return i; }
      return weights.length - 1;
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = rng.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    },
    id() { let s = ''; for (let i = 0; i < 3; i++) s += Math.floor(rng.float() * 1679616).toString(36).padStart(4, '0'); return s; }
  });

  const pad = (n) => String(n).padStart(2, '0');
  const util = (NEV.util = {
    clamp: (v, a, b) => Math.min(b, Math.max(a, v)),
    esc: (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    // Jour local au format AAAA-MM-JJ. NEV.__today permet de simuler une date (tests).
    todayStr(d) {
      if (!d && NEV.__today) return NEV.__today;
      d = d || new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    },
    parseDay(s) { const p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); },
    daysBetween(a, b) { return Math.round((util.parseDay(b) - util.parseDay(a)) / 86400000); },

    if (leaving) return;

    doc.documentElement.classList.add('nev-leaving');

        const t1 = (h + S1 + ch + K[j] + w[j]) | 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) | 0;
        h = gg; gg = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + gg) | 0; h7 = (h7 + h) | 0;
    }
    return [h0, h1, h2, h3, h4, h5, h6, h7].map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
  }
  NEV.sha256 = sha256hex;
  const hex = (u8) => Array.prototype.map.call(u8, (b) => b.toString(16).padStart(2, '0')).join('');

  async function hashPw(pw, salt) {
    const c = g.crypto;
    if (c && c.subtle && g.TextEncoder) {
      try {
        const enc = new TextEncoder();
        const key = await c.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
        const bits = await c.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256);
        return 'p1:' + hex(new Uint8Array(bits));
      } catch (e) { /* repli ci-dessous */ }
    }
    let h = sha256hex(salt + pw);
    for (let i = 0; i < 4000; i++) h = sha256hex(h + salt);
    return 's1:' + h;
  }

  /* ---------- comptes (enregistrés sur l'appareil) ---------- */
  const USERS = 'nev.users', SESSION = 'nev.session';
  const auth = (NEV.auth = {
    _users() { return NEV.store.get(USERS, {}); },
    validate(f) {
      const email = String(f.email || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return { field: 'email', msg: 'Entre une adresse email valide.' };
      return null;
    },
    codeOf(id) { return 'NEV' + String(id).replace(/[^a-z0-9]/gi, '').slice(-5).toUpperCase(); },
    check(f) {
      const email = String(f.email || '').trim().toLowerCase();
      const pseudo = String(f.pseudo || '').trim();
      if (pseudo.length < 2 || pseudo.length > 20) return { ok: false, field: 'pseudo', error: 'Ton pseudo doit faire entre 2 et 20 caractères.' };
      const bad = auth.validate({ email });
      if (bad) return { ok: false, field: bad.field, error: bad.msg };
      if (String(f.password || '').length < 8) return { ok: false, field: 'password', error: 'Le mot de passe doit faire au moins 8 caractères.' };
      if (f.password !== f.password2) return { ok: false, field: 'password2', error: 'Les deux mots de passe ne sont pas identiques.' };
      if (!f.consent) return { ok: false, field: 'consent', error: 'Coche la case pour confirmer que tu as lu le conseil de sécurité.' };
      if (!f.terms) return { ok: false, field: 'terms', error: 'Coche la case pour accepter les conditions d\'utilisation et la politique de confidentialité.' };
      return { ok: true, email, pseudo };
    },
    async signup(f) {
      const c = auth.check(f);
      if (!c.ok) return c;
      if (NEV.cloud && NEV.cloud.mode === 'server') return NEV.cloud.serverSignup(Object.assign({}, f, { email: c.email, pseudo: c.pseudo }));
      const users = auth._users();
      if (users[c.email]) return { ok: false, field: 'email', error: 'Un compte existe déjà avec cet email. Connecte-toi.' };
      const salt = rng.id();
      const id = 'u' + rng.id();
      const user = { id, email: c.email, pseudo: c.pseudo, salt, hash: await hashPw(f.password, salt), created: util.todayStr(), code: auth.codeOf(id), refCount: 0 };
      const ref = String(f.ref || '').trim().toUpperCase();
      let refUser = null;
      if (ref) {
        refUser = Object.keys(users).map((k) => users[k]).find((u) => u.code === ref);
        if (!refUser) return { ok: false, field: 'ref', error: 'Ce code de parrainage n\'existe pas (tu peux laisser la case vide).' };
        user.refBy = refUser.id;
        refUser.refCount = (refUser.refCount || 0) + 1;
      }
      users[c.email] = user;
      NEV.store.set(USERS, users);
      NEV.store.set(SESSION, { uid: user.id, email: c.email, at: Date.now() });
      if (refUser) { const p = P.load(user.id); p.ref.by = ref; P.save(p, user.id); }
      if (NEV.track) NEV.track('signup', { ref: !!refUser });
      return { ok: true, user: auth.current() };
    },
    async login(email, password) {
      email = String(email || '').trim().toLowerCase();
      if (NEV.cloud && NEV.cloud.mode === 'server') return NEV.cloud.serverLogin(email, String(password || ''));
      const u = auth._users()[email];
      if (!u) return { ok: false, field: 'email', error: 'Aucun compte avec cet email.' };
      if (u.banned) return { ok: false, field: 'email', error: 'Ce compte est suspendu. Écris-nous pour en savoir plus.' };
      const h = await hashPw(String(password || ''), u.salt);
      if (h !== u.hash) return { ok: false, field: 'password', error: 'Mot de passe incorrect.' };
      NEV.store.set(SESSION, { uid: u.id, email, at: Date.now() });
      if (NEV.track) NEV.track('login', {});
      return { ok: true, user: auth.current() };
    },
    current() {
      const s = NEV.store.get(SESSION, null);
      if (!s) return null;
      const u = auth._users()[s.email];
      if (!u || u.id !== s.uid) return null;
      return { id: u.id, email: u.email, pseudo: u.pseudo, created: u.created, code: u.code || auth.codeOf(u.id), refCount: u.refCount || 0 };
    },
    logout() { NEV.store.del(SESSION); if (NEV.cloud && NEV.cloud.mode === 'server') NEV.cloud.serverLogout(); },
    require() {
      const u = auth.current();
      if (!u) { NEV.go('connexion.html', 0); return null; }
      return u;
    }
  });

  /* ---------- niveau selon le maximum de pompes ---------- */
  const LEVELS = [
    { n: 1, name: 'Éveil', range: '1 à 5 pompes', desc: 'On pose les bases, en douceur.' },
    { n: 2, name: 'Initié', range: '6 à 15 pompes', desc: 'Les mouvements deviennent réguliers.' },
    { n: 3, name: 'Combattant', range: '16 à 30 pompes', desc: 'Tu tiens le rythme, on monte l\'intensité.' },
    { n: 4, name: 'Guerrier', range: '31 à 50 pompes', desc: 'Du volume, de la technique, du caractère.' },
    { n: 5, name: 'Légende', range: '51 pompes et plus', desc: 'Le haut du tableau : charges maximales.' }
  ];
  NEV.LEVELS = LEVELS;
  NEV.levelFromMax = function (x) {
    x = Math.round(Number(x));
    const n = x <= 5 ? 1 : x <= 15 ? 2 : x <= 30 ? 3 : x <= 50 ? 4 : 5;
    return LEVELS[n - 1];
  };
  const HERO = [
    { n: 1, name: 'Maigrichon', xp: 0 }, { n: 2, name: 'Éveillé', xp: 100 }, { n: 3, name: 'Athlète', xp: 300 },
    { n: 4, name: 'Costaud', xp: 700 }, { n: 5, name: 'Colosse', xp: 1400 }, { n: 6, name: 'Légende', xp: 2600 }
  ];
  NEV.HERO_STAGES = HERO;
  NEV.heroFromXp = function (xp) {
    let s = HERO[0];
    for (const h of HERO) if (xp >= h.xp) s = h;
    const next = HERO[s.n] || null;
    return { stage: s, next, pct: next ? util.clamp((xp - s.xp) / (next.xp - s.xp), 0, 1) : 1 };
  };

  /* ---------- profil du joueur : réglages, série, jour raté ---------- */
  const defaults = () => ({
    v: 1,
    maxPushups: null, level: null,
    setup: { focus: 'equilibre', sets: 3, camera: true, zones: [], equip: { chair: true, wall: true, bag: false, step: false, bottle: false, towel: false, bar: false, table: false } },
    progress: { streak: 0, best: 0, lastDone: null, total: 0, xp: 0 },
    daily: null,
    spe: null,
    pity: 0,
    history: [],
    collection: {},
    flames: 0, flamesTotal: 0, bonusDraws: 0, gifts: [],
    login: { last: null, streak: 0, best: 0, days: [] },
    badges: {},
    ref: { count: 0, paid: 0, by: null, welcomed: false },
    aura: 'none', auras: ['none'],
    updated: 0
  });
  const P = (NEV.player = {
    key(uid) { return 'nev.p.' + uid; },
    load(uid) {
      uid = uid || (auth.current() || {}).id;
      if (!uid) return null;
      const p = NEV.store.get(P.key(uid), null);
      const d = defaults();
      if (!p) return d;
      p.setup = Object.assign(d.setup, p.setup || {});
      p.setup.equip = Object.assign(d.setup.equip, (p.setup || {}).equip || {});
      p.progress = Object.assign(d.progress, p.progress || {});
      p.history = p.history || [];
      p.collection = p.collection || {};
      p.login = Object.assign(d.login, p.login || {});
      p.ref = Object.assign(d.ref, p.ref || {});
      p.badges = p.badges || {};
      p.auras = p.auras || ['none'];
      return Object.assign(d, p, { setup: p.setup, progress: p.progress });
    },
    save(p, uid) {
      uid = uid || (auth.current() || {}).id;
      if (uid) {
        p.updated = Date.now();
        NEV.store.set(P.key(uid), p);
        if (NEV.cloud && NEV.cloud.mode === 'server') NEV.cloud.pushPlayer(p);
      }
      return p;
    },
    /* Nouveau jour : on regarde si un jour a été raté.
       Jour raté (écart de 2 jours ou plus depuis le dernier entraînement) :
       la série retombe à 0 et l'enchaînement d'aujourd'hui est doublé. */
    ensureDay(p, today) {
      today = today || util.todayStr();
      if (!p.spe || p.spe.date !== today) p.spe = { date: today, zone: null, card: null, status: 'none', result: null };
      if (p.daily && p.daily.date === today) return p;
      const last = p.progress.lastDone;
      const gap = last ? util.daysBetween(last, today) : 0;
      const missed = last && gap >= 2 ? gap - 1 : 0;
      if (missed >= 1) { p.progress.streakLost = p.progress.streak; p.progress.streak = 0; }
      p.daily = { date: today, status: 'none', missed, double: missed >= 1, card: null, result: null };
      return p;
    },
    /* Fait avancer la série d'aujourd'hui (une seule fois par jour). */
    _touch(p, today, rest) {
      const last = p.progress.lastDone;
      if (last === today) return false;
      const gap = last ? util.daysBetween(last, today) : 0;
      p.progress.streak = (last && gap === 1) ? p.progress.streak + 1 : 1;
      p.progress.best = Math.max(p.progress.best, p.progress.streak);
      if (!rest) p.progress.total += 1; else p.progress.restDays = (p.progress.restDays || 0) + 1;
      p.progress.lastDone = today;
      return true;
    },
    /* Enregistre la séance (du jour ou de Spécialisation) et fait avancer série, XP, collection.
       res : { reps, sets, verified, src: 'daily' | 'spe' | 'combo', rest: true pour une carte Repos }.
       Le Repos garde la série mais ne compte pas comme un jour d'entraînement. */
    complete(p, res, today) {
      today = today || util.todayStr();
      P.ensureDay(p, today);
      res = res || {};
      const src = res.src === 'spe' ? 'spe' : 'daily';
      const slot = src === 'spe' ? p.spe : p.daily;
      const d = p.daily;
      if (slot.status === 'done') return { already: true, xpGain: 0, p };
      const card = slot.card;
      const isRest = !!(res.rest || (card && card.special === 'repos'));
      const tier = card ? card.tier : 1;
      const verified = res.verified !== false;
      const dayDone = d.status === 'done';
      let xpGain = isRest ? 20 : Math.round((30 + 20 * tier) * (d.double && !dayDone ? 1.5 : 1) * (verified ? 1 : 0.5));
      if (src === 'spe' && dayDone && !isRest) xpGain = Math.round(xpGain * 0.6); // bonus : une 2e séance rapporte moins
      const touched = P._touch(p, today, isRest);
      p.progress.xp += xpGain;
      slot.status = 'done';
      slot.result = { reps: res.reps, sets: res.sets, verified: !!verified, at: Date.now(), xpGain, rest: isRest };
      if (!dayDone) { // la séance règle aussi la journée (la Spécialisation peut remplacer la carte du jour)
        d.status = 'done'; d.result = Object.assign({ via: src }, slot.result);
      }
      if (card) {
        if (!isRest) p.collection[card.id] = (p.collection[card.id] || 0) + 1;
        p.history.unshift({ date: today, id: card.id, name: card.name, rarity: card.rarity, tier, reps: res.reps, sets: res.sets, verified: !!verified, doubled: !!(d.double && !dayDone), xpGain, src, rest: isRest, special: card.special || null });
        p.history = p.history.slice(0, 160);
      } else if (res.combo) {
        p.history.unshift({ date: today, id: 'combo:' + res.combo.id, name: res.combo.name, rarity: 'combo', tier: 1, reps: res.reps, sets: res.sets, verified: !!verified, doubled: false, xpGain, src: 'combo', rest: false });
        p.history = p.history.slice(0, 160);
      }
      return { already: false, xpGain, p, touched };
    },
    /* Séance « combo » (enchaînement libre) : XP selon le volume, la série avance si ce n'est pas déjà fait. */
    completeCombo(p, combo, res, today) {
      today = today || util.todayStr();
      P.ensureDay(p, today);
      res = res || {};
      const d = p.daily;
      const dayDone = d.status === 'done';
      const verified = res.verified !== false;
      let xpGain = Math.round((20 + 12 * (combo.items || []).length) * (verified ? 1 : 0.5));
      if (dayDone) xpGain = Math.round(xpGain * 0.6);
      P._touch(p, today, false);
      p.progress.xp += xpGain;
      if (!dayDone) {
        // un combo remplace la carte du jour s'il n'y en a pas de commencée ; la journée est alors validée
        d.status = 'done'; d.result = { via: 'combo', reps: res.reps, sets: res.sets, verified: !!verified, at: Date.now(), xpGain };
      }
      p.history.unshift({ date: today, id: 'combo:' + combo.id, name: combo.name, rarity: 'combo', tier: 1, reps: res.reps, sets: res.sets, verified: !!verified, doubled: false, xpGain, src: 'combo', rest: false });
      p.history = p.history.slice(0, 160);
      return { already: false, xpGain, p };
    }
  });
})(window);
</script>
<script>/* cloud.js */
/* ==========================================================
   neV.BOOSTER — cloud.js
   Le « branchement » du site. Deux modes, détectés tout seuls :
   - serveur : le site est servi par server/server.js (/api/health répond).
               Comptes, progression, chat, combos et badges sont alors
               partagés entre tous les joueurs, mots de passe hachés
               côté serveur (scrypt), session en cookie HttpOnly.
   - local   : site ouvert depuis un dossier ou un hébergement statique.
               Tout est enregistré dans ce navigateur (mode démo) : les
               joueurs d'un même appareil se voient, rien ne sort.
   Les pages utilisent NEV.ready(fn) puis NEV.cloud.* sans se soucier du mode.
   ========================================================== */
(function (g) {
  'use strict';
  const NEV = (g.NEV = g.NEV || {});
  const doc = g.document, store = NEV.store, util = NEV.util, rng = NEV.rng;
  const me = doc.currentScript;
  const ROOT = (function () { try { return new URL('..', me.src).href; } catch (e) { return ''; } })();
  const C = (NEV.cloud = { mode: 'local', info: null, root: ROOT });
  const pageName = (g.location.pathname.split('/').pop() || 'index.html').replace('.html', '') || 'index';

  /* ---------- appel d'API ---------- */
  async function api(path, method, body) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const to = ctl ? setTimeout(function () { ctl.abort(); }, 9000) : 0;
    try {
      const r = await fetch(ROOT + 'api/' + path, {
        method: method || 'GET', credentials: 'same-origin', cache: 'no-store', signal: ctl ? ctl.signal : undefined,
        headers: Object.assign({ 'X-NEV': '1' }, body ? { 'Content-Type': 'application/json' } : {}),
        body: body ? JSON.stringify(body) : undefined
      });
      let data = null; try { data = await r.json(); } catch (e) { /* corps vide */ }
      return { ok: r.ok, status: r.status, data: data || {} };
    } catch (e) {
      return { ok: false, status: 0, data: { error: 'Le serveur ne répond pas. Vérifie ta connexion.' } };
    } finally { clearTimeout(to); }
  }
  C.api = api;

  /* ---------- détection du mode ---------- */
  C.ready = (async function () {
    if (g.location.protocol === 'file:') return 'local';
    try {
      const r = await Promise.race([api('health'), new Promise(function (res) { setTimeout(function () { res({ ok: false }); }, 2500); })]);
      if (r.ok && r.data && r.data.app === 'neV.BOOSTER') { C.mode = 'server'; C.info = r.data; }
    } catch (e) { /* mode local */ }
    return C.mode;
  })();
  NEV.ready = function (fn) { return C.ready.then(fn); };

  /* ---------- suivi (pages vues, erreurs) ---------- */
  NEV.track = function (type, data) {
    try {
      const u = NEV.auth && NEV.auth.current ? NEV.auth.current() : null;
      if (C.mode === 'server') { api('event', 'POST', { type: type, page: pageName, data: data || {} }); return; }
      const ev = store.get('nev.events', []);
      ev.push({ t: Date.now(), type: type, page: pageName, uid: u ? u.id : null, name: u ? u.pseudo : null, data: data || {} });
      store.set('nev.events', ev.slice(-600));
    } catch (e) { /* le suivi ne doit jamais casser le site */ }
  };
  let errCount = 0;
  g.addEventListener('error', function (e) { if (errCount++ < 5) NEV.track('error', { msg: String(e.message || '').slice(0, 160), src: String(e.filename || '').split('/').pop(), line: e.lineno }); });
  g.addEventListener('unhandledrejection', function (e) { if (errCount++ < 5) NEV.track('error', { msg: String((e.reason && e.reason.message) || e.reason || '').slice(0, 160) }); });
  C.ready.then(function () { NEV.track('view', {}); });

  /* ====================================================================
     MODE SERVEUR : comptes et joueur
     ==================================================================== */
  const USERS = 'nev.users', SESSION = 'nev.session';
  function cacheServerUser(u, player) {
    const users = store.get(USERS, {});
    users[u.email] = Object.assign({ salt: '', hash: '', srv: true }, u);
    store.set(USERS, users);
    store.set(SESSION, { uid: u.id, email: u.email, at: Date.now(), srv: true });
    if (player) store.set(NEV.player.key(u.id), player);
  }
  C.serverSignup = async function (f) {
    const r = await api('signup', 'POST', { pseudo: f.pseudo, email: f.email, password: f.password, consent: !!f.consent, terms: !!f.terms, ref: f.ref || '', lang: (NEV.i18n && NEV.i18n.lang()) || 'fr' });
    if (!r.ok) return { ok: false, field: r.data.field, error: r.data.error || 'Inscription impossible pour le moment.' };
    cacheServerUser(r.data.user, r.data.player);
    return { ok: true, user: NEV.auth.current() };
  };
  C.serverLogin = async function (email, pw) {
    const r = await api('login', 'POST', { email: email, password: pw });
    if (!r.ok) return { ok: false, field: r.data.field || 'password', error: r.data.error || 'Connexion impossible.' };
    cacheServerUser(r.data.user, r.data.player);
    return { ok: true, user: NEV.auth.current() };
  };
  C.serverLogout = function () { api('logout', 'POST', {}); };

  // Au chargement d'une page : on vérifie la session et on récupère la progression du serveur.
  C.sync = async function () {
    if (C.mode !== 'server') return NEV.auth.current();
    const s = store.get(SESSION, null);
    if (!s) return null;
    const r = await api('me');
    if (r.status === 401) { store.del(SESSION); return null; }
    if (r.ok && r.data.user) {
      const local = store.get(NEV.player.key(r.data.user.id), null);
      const srv = r.data.player;
      cacheServerUser(r.data.user, (!local || !srv || (srv.updated || 0) >= (local.updated || 0)) ? srv : local);
      if (local && srv && (local.updated || 0) > (srv.updated || 0)) C.pushPlayer(local, true);
    }
    return NEV.auth.current();
  };

  let pushT = 0, lastP = null;
  C.pushPlayer = function (p, now) {
    lastP = p;
    clearTimeout(pushT);
    const go = function () { if (lastP) api('player', 'PUT', { player: lastP }); lastP = null; };
    if (now) go(); else pushT = setTimeout(go, 1200);
  };
  g.addEventListener('pagehide', function () { if (lastP && C.mode === 'server') { try { fetch(ROOT + 'api/player', { method: 'PUT', keepalive: true, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-NEV': '1' }, body: JSON.stringify({ player: lastP }) }); } catch (e) { /* ignoré */ } } });

  /* ====================================================================
     CONFIG PUBLIQUE : combos du coach, badges personnalisés, annonce
     ==================================================================== */
  C.config = async function () {
    if (C.mode === 'server') {
      const r = await api('config');
      return r.ok ? r.data : { combos: [], badges: [], announce: null };
    }
    return { combos: store.get('nev.combos', []).filter(function (c) { return c.published; }), badges: store.get('nev.badgedefs', []), announce: store.get('nev.announce', null) };
  };

  /* ====================================================================
     CHAT
     ==================================================================== */
  const cleanText = function (t) { return String(t || '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 280); };
  let lastSend = 0;
  C.chat = {
    // room : 'global' (tous les joueurs) ou 'coach' (ta conversation privée avec l'admin)
    async list(room) {
      if (C.mode === 'server') { const r = await api('chat?room=' + encodeURIComponent(room)); C.chat.gate = r.ok ? r.data.gate || null : null; return r.ok ? r.data.messages || [] : []; }
      C.chat.gate = null;
      const u = NEV.auth.current(); if (!u) return [];
      const key = room === 'coach' ? 'coach:' + u.id : 'global';
      return store.get('nev.chat', []).filter(function (m) { return m.room === key; }).slice(-120);
    },
    async send(room, text) {
      text = cleanText(text);
      if (!text) return { ok: false, error: 'Écris un message.' };
      if (Date.now() - lastSend < 1200) return { ok: false, error: 'Doucement : un message à la fois.' };
      if (NEV.Policy) { const mod = NEV.Policy.moderate(text); if (!mod.ok) return { ok: false, error: mod.error }; text = mod.text; }
      lastSend = Date.now();
      if (C.mode === 'server') { const r = await api('chat', 'POST', { room: room, text: text }); return r.ok ? { ok: true } : { ok: false, error: r.data.error || 'Message non envoyé.' }; }
      const u = NEV.auth.current(); if (!u) return { ok: false, error: 'Connecte-toi.' };
      const all = store.get('nev.chat', []);

    const bits = await g.crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 150000, hash: 'SHA-256' }, key, 256);
    return Array.prototype.map.call(new Uint8Array(bits), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

      workoutCount: wk.length, loginDays: T.logins.filter(function (x) { return x.uid === uid; }).map(function (x) { return x.day; }).sort().reverse().slice(0, 60),
      messages: T.chat_messages.filter(function (x) { return x.uid === uid; }).slice(-20).reverse().map(function (x) { return { room: x.room, text: x.text, t: x.t }; }),
      setup: data.setup || null
    };
  };
  DB.query = async function (sql) {
    if (C.mode !== 'server') return { error: 'La console SQL n\'existe qu\'en mode serveur (vraie base SQLite).' };
    const r = await api('admin/db/query', 'POST', { sql: sql }); return r.ok ? r.data : { error: r.data.error || 'Requête refusée.' };
  };
  DB.deleteRow = async function (table, rowid) { if (C.mode !== 'server') return false; const r = await api('admin/db/delete-row', 'POST', { table: table, rowid: rowid }); return r.ok; };
  DB.deleteUser = async function (uid) {
    if (C.mode === 'server') { const r = await api('admin/db/delete-user', 'POST', { uid: uid, confirm: true }); return r.ok; }
    const users = store.get(USERS, {}); let found = false;
    Object.keys(users).forEach(function (k) { if (users[k].id === uid) { delete users[k]; found = true; } });
    if (!found) return false; store.set(USERS, users); try { g.localStorage.removeItem(NEV.player.key(uid)); } catch (e) { /* ignoré */ }
    store.set('nev.chat', store.get('nev.chat', []).filter(function (m) { return m.uid !== uid && m.room !== 'coach:' + uid; })); return true;
  };
  DB.check = async function () { if (C.mode === 'server') { const r = await api('admin/db/check', 'POST', {}); return r.ok ? r.data : null; } return { integrity: 'ok', foreignKeys: 0 }; };
  DB.backupNow = async function () { if (C.mode !== 'server') return null; const r = await api('admin/db/backup-now', 'POST', {}); return r.ok ? r.data.info : null; };
  // liens de téléchargement (serveur) ou fichiers générés dans le navigateur (démo)
  DB.exportUrl = function (table, format) { return ROOT + 'api/admin/db/export?table=' + encodeURIComponent(table) + '&format=' + (format === 'csv' ? 'csv' : 'json'); };
  DB.backupUrl = function () { return ROOT + 'api/admin/db/backup'; };
  DB.localExport = function (table, format) { // démo : fabrique le fichier dans le navigateur
    const T = localTables(), names = table === 'all' ? Object.keys(T) : [table]; if (table !== 'all' && !T[table]) return null;
    let body, type, name;
    if (format === 'csv' && table !== 'all') {
      const cols = DB_COLS[table]; body = '﻿' + [cols.map(csvCell).join(',')].concat(T[table].map(function (r) { return cols.map(function (c) { return csvCell(r[c]); }).join(','); })).join('\r\n'); type = 'text/csv'; name = 'nev-' + table + '.csv';
    } else {
      const out = { app: 'neV.BOOSTER (démo)', exported: new Date().toISOString(), tables: {} };
      names.forEach(function (k) { out.tables[k] = T[k].map(function (r) { const o = Object.assign({}, r); delete o._rowid; ['data', 'items', 'value'].forEach(function (c) { if (typeof o[c] === 'string') { try { o[c] = JSON.parse(o[c]); } catch (e) { /* texte */ } } }); return o; }); });
      body = JSON.stringify(table === 'all' ? out : out.tables[table], null, 1); type = 'application/json'; name = table === 'all' ? 'nev-base-demo.json' : 'nev-' + table + '.json';
    }
    try { const a = doc.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: type })); a.download = name; doc.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500); return true; } catch (e) { return false; }
  };
})(window);

<script>/* rewards.js */
/* ==========================================================
   neV.BOOSTER — rewards.js
   Motivation : flammes de connexion, badges, parrainage, auras.
   - À chaque jour de connexion : +1 flamme (bonus aux paliers 7 et 30 jours).
   - Les badges se débloquent tout seuls selon des règles ; l'admin peut en
     créer d'autres (page admin) ou en offrir à la main.
   - Parrainage : un code par joueur ; le parrain gagne 50 flammes par filleul,
     le filleul 20 flammes de bienvenue.
   - Les flammes s'échangent contre des auras pour le héros.
   ========================================================== */
(function (g) {
  'use strict';
  const NEV = (g.NEV = g.NEV || {});
  const doc = g.document, util = NEV.util, esc = NEV.util.esc;

  const REF_BONUS = 50, WELCOME_BONUS = 20;

  /* ---------- pictogrammes (grille 24) ---------- */
  const ICONS = {
    flame: 'M12 2.5c.9 3.6 5.2 5.6 5.2 10.4a5.2 5.2 0 01-10.4 0c0-1.8.8-3.2 1.8-4.2.2 1.6.9 2.6 1.9 3C10 8.7 10.6 5.6 12 2.5z',
    bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
    star: 'M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.4 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z',
    heart: 'M12 20s-7-4.6-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.4-7 10-7 10z',
    check: 'M5 12.5l4.5 4.5L19 7.5',
    crown: 'M3 18l1.5-10 5 5L12 5l2.5 8 5-5L21 18z',
    dumbbell: 'M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12',
    target: 'M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z',
    people: 'M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 11a2.5 2.5 0 100-5M18 14c2 .4 3.5 2.4 3.5 5',
    eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6z',
    moon: 'M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z',
    drop: 'M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z',
    trophy: 'M8 4h8v5a4 4 0 01-8 0zM8 6H4v2a4 4 0 004 4M16 6h4v2a4 4 0 01-4 4M12 13v4M8 20h8M10 17h4',
    gift: 'M4 11h16v9H4zM3 8h18v3H3zM12 8v12M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0',
    shield: 'M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z'
  };
  const FILLED = { flame: 1, bolt: 1, star: 1, heart: 1, crown: 1, moon: 1, drop: 1 };

  const SHAPES = {
    shield: 'M50 5L89 18V50C89 74 71 90 50 96 29 90 11 74 11 50V18Z',
    hex: 'M50 4L90 27V73L50 96 10 73V27Z',
    circle: 'M50 6a44 44 0 100 88 44 44 0 100-88z',
    star: (function () { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 22 : 46; d += (i ? 'L' : 'M') + (50 + r * Math.cos(a)).toFixed(1) + ' ' + (52 + r * Math.sin(a)).toFixed(1); } return d + 'Z'; })(),
    flame: 'M50 3C57 22 84 34 84 62 84 82 69 96 50 96 31 96 16 82 16 62 16 47 27 39 33 28 36 38 42 43 47 41 44 28 46 14 50 3Z',
    diamond: 'M50 4L92 50 50 96 8 50Z'
  };
  let uid = 0;
  /* Dessine un badge en SVG. def = {shape, icon, text, c1, c2} */
  function badgeSVG(def, size, locked) {
    const id = 'bg' + (++uid), shape = SHAPES[def.shape] || SHAPES.shield;
    const c1 = def.c1 || '#e0455f', c2 = def.c2 || '#7a0f26';
    const gray = locked ? ' style="filter:grayscale(1) brightness(.5)"' : '';
    let inner = '';
    if (def.text) inner = '<text x="50" y="' + (def.text.length > 2 ? 62 : 64) + '" text-anchor="middle" font-family="Montserrat,system-ui,sans-serif" font-weight="900" font-size="' + (def.text.length > 3 ? 20 : def.text.length > 2 ? 26 : def.text.length > 1 ? 34 : 40) + '" fill="#fff" stroke="#00000033" stroke-width="1">' + esc(def.text) + '</text>';
    else if (ICONS[def.icon]) {
      const f = FILLED[def.icon];
      inner = '<g transform="translate(26 28) scale(2)"><path d="' + ICONS[def.icon] + '" fill="' + (f ? '#fff' : 'none') + '" stroke="#fff" stroke-width="' + (f ? 1 : 1.9) + '" stroke-linecap="round" stroke-linejoin="round"/></g>';
    }
    return '<svg class="badge-svg" viewBox="0 0 100 100" width="' + (size || 72) + '" height="' + (size || 72) + '" role="img" aria-label="' + esc(def.name || 'Badge') + '"' + gray + '>' +
      '<defs><linearGradient id="' + id + 'a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + esc(c1) + '"/><stop offset="1" stop-color="' + esc(c2) + '"/></linearGradient>' +
      '<linearGradient id="' + id + 'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + shape + '" fill="url(#' + id + 'a)" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="' + shape + '" fill="url(#' + id + 'b)"/>' + inner + '</svg>';
  }

  /* ---------- badges de base ---------- */
  const B = (id, name, desc, shape, icon, text, c1, c2, t, v) => ({ id, name, desc, shape, icon, text, c1, c2, rule: { t, v }, base: true });
  const FIRE = ['#ffb04a', '#c2410c'], RUBY = ['#ff4a63', '#7a0f26'], GOLD = ['#ffd45e', '#a8690f'], STEEL = ['#c9d2e0', '#566077'], VIOLET = ['#c06bff', '#5b1a8c'], GREEN = ['#3ddc84', '#0f6a3a'];
  const DEFAULT_BADGES = [
    B('t1', 'Premier pas', 'Première séance terminée.', 'circle', 'check', '', RUBY[0], RUBY[1], 'total', 1),
    B('s3', 'Étincelle', '3 jours d\'entraînement d\'affilée.', 'flame', 'flame', '', FIRE[0], FIRE[1], 'streak', 3),
    B('s7', 'Semaine de feu', '7 jours d\'entraînement d\'affilée.', 'flame', '', '7', FIRE[0], FIRE[1], 'streak', 7),
    B('s14', 'Deux semaines', '14 jours d\'affilée.', 'shield', '', '14', RUBY[0], RUBY[1], 'streak', 14),
    B('s30', 'Mois de fer', '30 jours d\'affilée.', 'shield', '', '30', STEEL[0], STEEL[1], 'streak', 30),
    B('s60', 'Inarrêtable', '60 jours d\'affilée.', 'hex', '', '60', GOLD[0], GOLD[1], 'streak', 60),
    B('s100', 'Centurion', '100 jours d\'affilée.', 'star', 'crown', '', GOLD[0], GOLD[1], 'streak', 100),
    B('t10', 'Régulier', '10 séances validées.', 'hex', '', '10', RUBY[0], RUBY[1], 'total', 10),
    B('t25', 'Habitué', '25 séances validées.', 'hex', '', '25', FIRE[0], FIRE[1], 'total', 25),
    B('t50', 'Vétéran', '50 séances validées.', 'hex', '', '50', STEEL[0], STEEL[1], 'total', 50),
    B('t100', '100 séances', '100 séances validées.', 'star', 'trophy', '', GOLD[0], GOLD[1], 'total', 100),
    B('l3', 'Fidèle', '3 jours de connexion d\'affilée.', 'circle', 'bolt', '', '#ffd45e', '#c2410c', 'loginstreak', 3),
    B('l7', 'Assidu', '7 jours de connexion d\'affilée.', 'circle', 'flame', '', FIRE[0], FIRE[1], 'loginstreak', 7),
    B('l30', 'Pilier', '30 jours de connexion d\'affilée.', 'diamond', 'flame', '', RUBY[0], RUBY[1], 'loginstreak', 30),
    B('w1', 'Bienvenue', 'Tu as rejoint neV.BOOSTER grâce à un parrain.', 'circle', 'gift', '', '#ff8aa0', '#8e1230', 'welcomed', 1),
    B('r1', 'Recruteur', 'Un ami s\'est inscrit avec ton code.', 'circle', 'people', '', GREEN[0], GREEN[1], 'referrals', 1),
    B('r3', 'Capitaine', '3 amis parrainés.', 'shield', 'people', '', GREEN[0], GREEN[1], 'referrals', 3),
    B('r10', 'Chef de meute', '10 amis parrainés.', 'star', 'people', '', GOLD[0], GOLD[1], 'referrals', 10),
    B('e3', 'Chasseur d\'Épique', 'Tu as tiré une carte Épique.', 'diamond', 'star', '', RUBY[0], RUBY[1], 'tier', 3),
    B('e4', 'Légendaire', 'Tu as tiré une carte Légendaire.', 'diamond', 'star', '', GOLD[0], GOLD[1], 'tier', 4),
    B('e5', 'Mythique !', 'Tu as tiré une carte Mythique : très rare.', 'diamond', 'star', '', VIOLET[0], VIOLET[1], 'tier', 5),
    B('c15', 'Collectionneur', '15 exercices différents tirés.', 'hex', 'target', '', STEEL[0], STEEL[1], 'collection', 15),
    B('c30', 'Encyclopédie', '30 exercices différents tirés.', 'hex', 'target', '', GOLD[0], GOLD[1], 'collection', 30),
    B('ph', 'Phénix', 'Journée ratée… puis enchaînement doublé réussi.', 'flame', 'bolt', '', '#ff6a4d', '#7a0f26', 'doubled', 1),
    B('cam', 'Œil de lynx', '10 séances validées par la caméra.', 'circle', 'eye', '', GREEN[0], GREEN[1], 'verified', 10),
    B('p50', 'Pompes 50', 'Maximum de 50 pompes ou plus.', 'shield', 'dumbbell', '', RUBY[0], RUBY[1], 'pushups', 50),
    B('x1000', '1000 XP', 'Tu as gagné 1000 XP.', 'hex', 'bolt', '', GOLD[0], GOLD[1], 'xp', 1000)
  ];

  const RULES = {
    streak: { label: 'Série d\'entraînement (jours)', get: (p) => Math.max(p.progress.streak, p.progress.best) },
    total: { label: 'Séances validées', get: (p) => p.progress.total },
    xp: { label: 'XP gagnés', get: (p) => p.progress.xp },
    loginstreak: { label: 'Série de connexion (jours)', get: (p) => Math.max(p.login.streak, p.login.best) },
    referrals: { label: 'Amis parrainés', get: (p) => p.ref.count },
    tier: { label: 'Rareté tirée (1 à 5)', get: (p) => p.history.reduce((a, h) => Math.max(a, h.tier || 0), 0) },
    collection: { label: 'Exercices différents tirés', get: (p) => Object.keys(p.collection).length },
    doubled: { label: 'Enchaînements doublés réussis', get: (p) => p.history.filter((h) => h.doubled).length },
    verified: { label: 'Séances validées par caméra', get: (p) => p.history.filter((h) => h.verified).length },
    pushups: { label: 'Maximum de pompes', get: (p) => p.maxPushups || 0 },
    flames: { label: 'Flammes gagnées au total', get: (p) => p.flamesTotal },
    welcomed: { label: 'Inscrit avec un code de parrain', get: (p) => (p.ref.by ? 1 : 0) },
    manual: { label: 'Offert à la main par l\'admin', get: () => 0 }
  };

  let custom = [];
  const defs = () => DEFAULT_BADGES.concat(custom.map((b) => Object.assign({}, b, { custom: true })));
  const earned = (p, d) => !!(RULES[d.rule && d.rule.t] && d.rule.t !== 'manual' && RULES[d.rule.t].get(p) >= Number(d.rule.v));

  /* ---------- auras du héros (contre des flammes) ---------- */
  const AURAS = [
    { id: 'none', name: 'Aucune', cost: 0, c: ['#e0455f', '#7a0f26'] },
    { id: 'braise', name: 'Braise', cost: 10, c: ['#ff8a3d', '#e0455f'] },
    { id: 'rubis', name: 'Rubis', cost: 25, c: ['#ff4a63', '#a3153a'] },
    { id: 'or', name: 'Or', cost: 50, c: ['#ffd45e', '#f0b24a'] },
    { id: 'foudre', name: 'Foudre', cost: 80, c: ['#8ec5ff', '#ffffff'] },
    { id: 'mythe', name: 'Mythe', cost: 150, c: ['#c06bff', '#ffd1ff'] }
  ];

  /* ---------- flammes de connexion ---------- */
  function daily(p, today) {
    today = today || util.todayStr();
    const l = p.login;
    if (l.last === today) return null;
    const gap = l.last ? util.daysBetween(l.last, today) : 0;
    l.streak = l.last && gap === 1 ? l.streak + 1 : 1;
    l.best = Math.max(l.best, l.streak);
    l.days.push(today); l.days = l.days.slice(-90);
    let gain = 1, milestone = null;
    if (l.streak % 30 === 0) { gain += 10; milestone = l.streak + ' jours de connexion'; } else if (l.streak % 7 === 0) { gain += 4; milestone = l.streak + ' jours de connexion'; }
    l.last = today;
    p.flames += gain; p.flamesTotal += gain;
    return { gain, streak: l.streak, milestone, lost: l.streak === 1 && gap > 1 };
  }

  /* ---------- parrainage (récompenses dues) ---------- */
  function syncRef(p, user) {
    const out = [];
    if (p.ref.by && !p.ref.welcomed) { p.ref.welcomed = true; p.flames += WELCOME_BONUS; p.flamesTotal += WELCOME_BONUS; out.push({ gain: WELCOME_BONUS, why: 'Bienvenue : tu as utilisé un code de parrain.' }); }
    const c = (user && user.refCount) || 0;
    if (c > p.ref.paid) {
      const n = c - p.ref.paid, gain = n * REF_BONUS;
      p.ref.paid = c; p.flames += gain; p.flamesTotal += gain;
      out.push({ gain, why: n + (n > 1 ? ' amis ont rejoint' : ' ami a rejoint') + ' neV.BOOSTER avec ton code !' });
    }
    p.ref.count = c;
    return out;
  }

  /* Attribue les badges mérités. Renvoie les nouveaux. */
  function check(p, today) {
    today = today || util.todayStr();
    const fresh = [];
    defs().forEach((d) => { if (!p.badges[d.id] && earned(p, d)) { p.badges[d.id] = today; fresh.push(d); } });
    return fresh;
  }

  function run(p, user) {
    const fx = { daily: daily(p), refs: syncRef(p, user), badges: [], gifts: [] };
    fx.badges = check(p);
    // cadeaux de l'admin (flammes / tirages bonus) : déjà ajoutés par le serveur, on les annonce une fois
    (p.gifts || []).forEach(function (g) { if (!g.seen) { g.seen = true; fx.gifts.push(g); } });
    if (fx.daily || fx.refs.length || fx.badges.length || fx.gifts.length) NEV.player.save(p);
    return fx;
  }

  /* ---------- fenêtre de fête ---------- */
  function popup(o) { // {title, sub, flames, badge, big}
    return new Promise(function (resolve) {
      const el = doc.createElement('div');
      el.className = 'fx-pop'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-live', 'polite');
      let em = '';
      for (let i = 0; i < 14; i++) em += '<i style="--x:' + (Math.random() * 100).toFixed(0) + '%;--d:' + (Math.random() * 1.6).toFixed(2) + 's;--s:' + (0.6 + Math.random() * 0.9).toFixed(2) + '"></i>';
      el.innerHTML = '<div class="embers" aria-hidden="true">' + em + '</div><div class="card">' +
        (o.badge ? '<div class="bd">' + badgeSVG(o.badge, 120) + '</div>' : '<div class="fl">' + NEV.ui.icons.flame.replace('width="14" height="14"', 'width="64" height="64"') + '</div>') +
        '<div class="eyebrow">' + esc(o.kicker || '') + '</div><h3>' + esc(o.title) + '</h3><p>' + esc(o.sub || '') + '</p>' +
        (o.flames ? '<div class="gain">+' + o.flames + ' flamme' + (o.flames > 1 ? 's' : '') + '</div>' : '') +
        '<button class="btn" type="button">Continuer</button></div>';
      doc.body.appendChild(el);
      requestAnimationFrame(function () { el.classList.add('on'); });
      const close = function () { el.classList.remove('on'); setTimeout(function () { el.remove(); resolve(); }, 350); };
      el.querySelector('button').addEventListener('click', close);
      el.addEventListener('click', function (e) { if (e.target === el) close(); });
      setTimeout(function () { const b = el.querySelector('button'); if (b) b.focus(); }, 400);
    });
  }
  async function popups(fx) {
    if (fx.daily) {
      await popup({ kicker: 'Flamme du jour', title: fx.daily.streak > 1 ? fx.daily.streak + ' jours de connexion !' : 'Bienvenue !', sub: fx.daily.milestone ? 'Palier atteint : ' + fx.daily.milestone + '. Bonus de flammes !' : (fx.daily.lost ? 'Une nouvelle série démarre aujourd\'hui.' : 'Reviens demain pour allonger ta série de connexion.'), flames: fx.daily.gain });
    }
    for (const r of fx.refs) await popup({ kicker: 'Parrainage', title: 'Récompense reçue', sub: r.why, flames: r.gain });
    for (const g of (fx.gifts || [])) {
      const parts = []; if (g.flames) parts.push(g.flames + ' flamme' + (g.flames > 1 ? 's' : '')); if (g.draws) parts.push(g.draws + ' tirage' + (g.draws > 1 ? 's' : '') + ' de gacha bonus');
      await popup({ kicker: 'Cadeau du coach', title: 'Tu as reçu un cadeau !', sub: (g.note ? g.note + ' — ' : '') + parts.join(' et ') + '.', flames: g.flames || 0 });
    }
    for (const b of fx.badges) await popup({ kicker: 'Nouveau badge', title: b.name, sub: b.desc, badge: b });
  }

  function setCustom(list) { custom = Array.isArray(list) ? list : []; }
  function buyAura(p, id) {
    const a = AURAS.find((x) => x.id === id);
    if (!a) return { ok: false, error: 'Aura inconnue.' };
    if (p.auras.indexOf(id) >= 0) { p.aura = id; return { ok: true }; }
    if (p.flames < a.cost) return { ok: false, error: 'Il te manque ' + (a.cost - p.flames) + ' flammes.' };
    p.flames -= a.cost; p.auras.push(id); p.aura = id;
    return { ok: true };
  }

  NEV.Rewards = { ICONS, SHAPES, RULES, AURAS, DEFAULT_BADGES, REF_BONUS, WELCOME_BONUS, defs, setCustom, badgeSVG, earned, daily, syncRef, check, run, popup, popups, buyAura,
    aura: (id) => AURAS.find((a) => a.id === id) || AURAS[0] };
})(window);
</script>
<script>/* ex-data.js */
/* ==========================================================
   neV.BOOSTER — ex-data.js
   Les fiches d'exercices : les 28 de base (ta liste), ceux de tes
   documents, et des ajouts faisables à la maison.

<script>/* exercises.js */
/* ==========================================================
   neV.BOOSTER — exercises.js
   Réunit les fiches (ex-data.js) et les animations (ex-anim.js)
   dans NEV.EXERCISES, que lisent le gacha, la bibliothèque,
   l'exercice par caméra et l'espace admin.
   ========================================================== */
(function (g) {
  'use strict';
  const NEV = (g.NEV = g.NEV || {});
  const data = NEV.EX_DATA || [], anim = NEV.EX_ANIM || {};
  const TIER_NAMES = ['', 'Facile', 'Moyen', 'Costaud', 'Difficile', 'Extrême'];

  const list = data.map((e) => {
    const a = anim[e.id];
    return Object.assign({}, e, {
      anim: a || null,
      muscles: a ? a.muscles : [],
      cam: Object.assign({ place: NEV.CAM_PLACE[(e.cam || {}).view || 'any'] }, e.cam || {}),
      cam_ok: !!e.cam,
      tierName: TIER_NAMES[e.tier] || ''
    });
  });
  list.forEach((e) => { if (!e.anim) console.warn('[neV] animation manquante :', e.id); });

  const byId = {};
  list.forEach((e) => { byId[e.id] = e; });

  NEV.EXERCISES = list;
  NEV.Ex = {
    byId: (id) => byId[id] || null,
    list: () => list,
    inCat: (catId) => list.filter((e) => e.group === catId),
    TIER_NAMES,
    /* Texte « 3 séries de 12 rép. » pour un plan de séance */
    amountText(unit, per) {
      if (unit === 'sec') return per + ' s';
      if (unit === 'secside') return per + ' s par côté';
      if (unit === 'side') return per + ' par côté';
      return per + ' rép.';
    },
    equipText(e) { return (e.equip || []).length ? (e.equip || []).map((k) => NEV.EQUIP[k]).join(' + ') : 'Aucun matériel'; },
    musclesText(e) { return (e.muscles || []).map((m) => NEV.MUSCLES_FR[m]).filter(Boolean).join(', '); }
  };
})(window);
</script>

      '<h2>Exercices les plus tirés</h2><div class="chart">' + hbars(s.topExercises.map((x) => [exName(x.id), x.n])) + '</div>';

        (alerts.length ? alerts.map((a) => '<div class="warnbar">⚠️ ' + esc(a) + '</div>').join('') : '<div class="warnbar" style="background:#3ddc8412;border-color:#3ddc8455">✅ Aucune alerte.</div>') +
        kpi([[ping == null ? 'Hors ligne' : ping + ' ms', 'Réponse du serveur'], [sv.mode || '—', 'Mode'], [sv.uptimeS != null ? Math.floor(sv.uptimeS / 3600) + ' h ' + Math.floor(sv.uptimeS % 3600 / 60) + ' min' : '—', 'En ligne depuis'], [sv.memMB != null ? sv.memMB + ' Mo' : '—', 'Mémoire'], [sv.requests != null ? sv.requests : '—', 'Requêtes servies'], [sv.blocked != null ? sv.blocked : '—', 'Requêtes bloquées'], [sv.badLogins != null ? sv.badLogins : '—', 'Connexions refusées'], [sv.sessions != null ? sv.sessions : '—', 'Sessions ouvertes'], [sv.node || '—', 'Version de Node']]) +
        '<div class="g2"><div class="chart"><h3>Pages vues (journal récent)</h3>' + hbars(Object.keys(pages).map((k) => [k, pages[k]]).sort((a, b) => b[1] - a[1]).slice(0, 10)) + '</div><div class="chart"><h3>Joueurs actifs (7 jours)</h3>' + bars(s.active, s.days.map(fd)) + '</div></div>' +
        '<h2>Journal</h2><div class="row"><select id="evt" aria-label="Type d\'événement"><option value="">Tous les types</option>' + ['view', 'error', 'login', 'signup', 'gacha', 'session', 'camera'].map((x) => '<option' + (x === type ? ' selected' : '') + '>' + x + '</option>').join('') + '</select><button type="button" class="btn ghost sm" id="rf">Rafraîchir</button><span class="muted" style="font-size:.78rem">Mise à jour automatique toutes les 15 s</span></div>' +

    /* --- tables --- */

        grid(cols, d.rows, { sortable: true, sort: st.sort, dir: st.dir, clickable: true }) +
        '<div class="row"><button type="button" class="btn ghost sm" id="pp"' + (d.page <= 1 ? ' disabled' : '') + '>‹ Précédent</button><span class="muted">Page ' + d.page + ' / ' + d.pages + '</span><button type="button" class="btn ghost sm" id="pn"' + (d.page >= d.pages ? ' disabled' : '') + '>Suivant ›</button></div>';

      } catch (er) { toast(er.message, 1); }
    }
    $('main').onchange = (e) => { const s = e.target.closest('select[data-id]'); if (s) { const id = s.dataset.id, note = ($('rvl').querySelector('input[data-n="' + id + '"]') || {}).value || ''; save(id, s.value, note).then(draw); } const i = e.target.closest('input[data-n]'); if (i && rv[i.dataset.n]) save(i.dataset.n, rv[i.dataset.n].status, i.value); };
  };

  gate();
})();
</script>
